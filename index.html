    <script>
        // Check for browser support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            document.getElementById('errorMessage').textContent =
                'Sorry, your browser does not support speech recognition. Please use Chrome, Edge, or Safari.';
            document.getElementById('errorMessage').style.display = 'block';
            const holdBtn = document.getElementById('holdButton');
            holdBtn.disabled = true;
            holdBtn.style.opacity = '0.5';
            holdBtn.style.cursor = 'not-allowed';
        } else {
            // Initialize speech recognition
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            // Request mic permission on every load so the prompt appears immediately
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => stream.getTracks().forEach(t => t.stop()))
                .catch(() => {});

            let isListening = false;
            let isHoldToSpeak = false;
            let finalTranscript = '';
            let lastProcessedIndex = 0; // guards against Android bug where resultIndex is always 0

            // Landscape word-swipe state
            let landscapeWords = [];
            let landscapeIndex = 0;
            let landscapeActive = false;
            let landscapeTouchStartX = 0;
            let landscapeTouchStartY = 0;
            const LANDSCAPE_SWIPE_THRESHOLD = 50;

            const holdButton = document.getElementById('holdButton');
            const clearButton = document.getElementById('clearButton');
            let transcriptText = document.getElementById('transcriptText');
            const transcriptContainer = document.getElementById('transcriptContainer');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const errorMessage = document.getElementById('errorMessage');
            const increaseFontButton = document.getElementById('increaseFontButton');
            const decreaseFontButton = document.getElementById('decreaseFontButton');
            const copyButton = document.getElementById('copyButton');
            const copyButtonText = document.getElementById('copyButtonText');
            const commandIndicator = document.getElementById('commandIndicator');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const editButton = document.getElementById('editButton');
            const editDoneButton = document.getElementById('editDoneButton');
            const header = document.getElementById('header');
            const fullscreenButton = document.getElementById('fullscreenButton');
            const questionMarkButton = document.getElementById('questionMarkButton');
            const quickActions = document.getElementById('quickActions');
            const fullscreenOverlay = document.getElementById('fullscreenOverlay');
            const fullscreenClose = document.getElementById('fullscreenClose');
            const fullscreenText = document.getElementById('fullscreenText');
            const landscapeOverlay = document.getElementById('landscapeOverlay');

            // Theme management
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeIcon.textContent = '☀️';
            }

            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                themeIcon.textContent = isDark ? '☀️' : '🌙';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });

            // Voice commands configuration
            const voiceCommands = {
                'clear text': () => {
                    finalTranscript = '';
                    transcriptText.innerHTML = isListening ?
                        '<div class="placeholder">Listening...</div>' :
                        '<div class="placeholder">Hold to speak</div>';
                    showCommandFeedback('✓ Text Cleared');
                }
            };

            // Function to show command feedback
            function showCommandFeedback(message, isError = false) {
                commandIndicator.textContent = message;
                commandIndicator.classList.remove('error');
                if (isError) {
                    commandIndicator.classList.add('error');
                }
                commandIndicator.classList.add('show');

                setTimeout(() => {
                    commandIndicator.classList.remove('show');
                }, 1500);
            }

            // Function to detect and execute voice commands
            function detectVoiceCommand(text) {
                const lowerText = text.toLowerCase().trim();

                for (const [command, action] of Object.entries(voiceCommands)) {
                    if (lowerText.includes(command)) {
                        // Execute the command
                        action();
                        return true;
                    }
                }
                return false;
            }

            // Pause detection
            let lastSpeechTime = Date.now();
            let pauseTimer = null;
            const PAUSE_THRESHOLD = 1000; // 1 second

            // Font size management
            const MIN_FONT_SIZE = 20;
            const MAX_FONT_SIZE = 100;
            const FONT_STEP = 4;
            let currentFontSize = parseInt(localStorage.getItem('transcriptFontSize')) || 48;

            function updateFontSize(size) {
                currentFontSize = Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, size));
                transcriptText.style.fontSize = currentFontSize + 'px';
                localStorage.setItem('transcriptFontSize', currentFontSize);

                // Update placeholder size to be proportional
                const placeholder = transcriptText.querySelector('.placeholder');
                if (placeholder) {
                    placeholder.style.fontSize = Math.max(20, currentFontSize * 0.67) + 'px';
                }

                // Update button states
                decreaseFontButton.disabled = currentFontSize <= MIN_FONT_SIZE;
                increaseFontButton.disabled = currentFontSize >= MAX_FONT_SIZE;
            }

            // Initialize font size on load
            updateFontSize(currentFontSize);

            // Font size button handlers
            increaseFontButton.addEventListener('click', () => {
                updateFontSize(currentFontSize + FONT_STEP);
            });

            decreaseFontButton.addEventListener('click', () => {
                updateFontSize(currentFontSize - FONT_STEP);
            });

            // Copy button click handler
            copyButton.addEventListener('click', async () => {
                try {
                    // Get only the text content, excluding HTML tags
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = finalTranscript;

                    // Remove HR elements and get text
                    const hrs = tempDiv.querySelectorAll('hr');
                    hrs.forEach(hr => hr.replaceWith('\n\n'));

                    let textToCopy = tempDiv.textContent.trim();

                    if (!textToCopy) {
                        return; // Nothing to copy
                    }

                    await navigator.clipboard.writeText(textToCopy);

                    // Show feedback
                    copyButton.classList.add('copied');
                    copyButtonText.textContent = 'Copied!';

                    setTimeout(() => {
                        copyButton.classList.remove('copied');
                        copyButtonText.textContent = 'Copy';
                    }, 2000);
                } catch (error) {
                    console.error('Failed to copy:', error);
                    copyButtonText.textContent = 'Failed';
                    setTimeout(() => {
                        copyButtonText.textContent = 'Copy';
                    }, 2000);
                }
            });

            // Hold-to-speak button handlers
            function startHoldToSpeak() {
                if (isListening || isEditing) return;
                isHoldToSpeak = true;
                holdButton.classList.add('holding');
                try {
                    recognition.start();
                } catch (error) {
                    console.error('Hold to speak start error:', error);
                    isHoldToSpeak = false;
                    holdButton.classList.remove('holding');
                }
            }

            function stopHoldToSpeak() {
                if (!isHoldToSpeak) return;
                isHoldToSpeak = false;
                holdButton.classList.remove('holding');
                recognition.stop();
            }

            holdButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startHoldToSpeak();
            }, { passive: false });

            holdButton.addEventListener('touchend', (e) => {
                e.preventDefault();
                stopHoldToSpeak();
            }, { passive: false });

            holdButton.addEventListener('touchcancel', () => {
                stopHoldToSpeak();
            });

            // Mouse fallback for desktop testing
            holdButton.addEventListener('mousedown', startHoldToSpeak);
            holdButton.addEventListener('mouseup', stopHoldToSpeak);
            holdButton.addEventListener('mouseleave', stopHoldToSpeak);

            // Prevent context menu on long press
            holdButton.addEventListener('contextmenu', (e) => e.preventDefault());

            // Transcript area: press anywhere to record (same as hold button).
            // In correction mode, taps select words instead — so skip these handlers
            // (and crucially don't preventDefault, so word clicks still fire).
            transcriptContainer.addEventListener('touchstart', (e) => {
                if (!isEditing && !correctMode) {
                    e.preventDefault();
                    startHoldToSpeak();
                }
            }, { passive: false });

            transcriptContainer.addEventListener('touchend', (e) => {
                if (!isEditing && !correctMode) {
                    e.preventDefault();
                    stopHoldToSpeak();
                }
            }, { passive: false });

            transcriptContainer.addEventListener('touchcancel', () => {
                if (!isEditing && !correctMode) stopHoldToSpeak();
            });

            transcriptContainer.addEventListener('mousedown', (e) => {
                if (!isEditing && !correctMode) startHoldToSpeak();
            });
            transcriptContainer.addEventListener('mouseup', (e) => {
                if (!isEditing) stopHoldToSpeak();
            });
            transcriptContainer.addEventListener('mouseleave', (e) => {
                if (!isEditing) stopHoldToSpeak();
            });

            transcriptContainer.addEventListener('contextmenu', (e) => {
                if (!isEditing) e.preventDefault();
            });

            // Clear button click handler
            clearButton.addEventListener('click', () => {
                finalTranscript = '';
                hidePopover();
                if (correctMode) setCorrectMode(false);
                if (isListening) {
                    transcriptText.innerHTML = '<div class="placeholder">Listening...</div>';
                } else {
                    transcriptText.innerHTML = '<div class="placeholder">Hold to speak</div>';
                }
                editButton.disabled = true;
                copyButton.disabled = true;
                fullscreenButton.disabled = true;
                correctButton.disabled = true;
                quickActions.classList.remove('visible');
                errorMessage.style.display = 'none';
                lastSpeechTime = Date.now(); // Reset pause timer
                updateFontSize(currentFontSize); // Update placeholder font size
                syncLandscapeWords(false);
            });

            // Question mark button
            questionMarkButton.addEventListener('click', () => {
                if (!finalTranscript) return;
                finalTranscript = finalTranscript
                    .replace(/(<hr class="speech-separator">|\s)*$/, '') + '?';
                renderTranscript('');
                transcriptContainer.scrollTop = transcriptContainer.scrollHeight;
                syncLandscapeWords(false);
            });

            // Edit mode
            let isEditing = false;
            let wasListeningBeforeEdit = false;

            function enterEditMode() {
                if (isEditing || !finalTranscript) return;
                if (correctMode) setCorrectMode(false);   // removes word spans before contentEditable
                hidePopover();
                isEditing = true;
                wasListeningBeforeEdit = isListening;
                if (isListening) recognition.stop();

                transcriptText.contentEditable = 'true';
                header.classList.add('edit-mode');
                transcriptContainer.classList.add('edit-mode');
                quickActions.classList.remove('visible');

                // Place cursor at end
                transcriptText.focus();
                const range = document.createRange();
                range.selectNodeContents(transcriptText);
                range.collapse(false);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }

            function exitEditMode() {
                if (!isEditing) return;
                isEditing = false;

                // Sync edits back to finalTranscript before replacing element
                finalTranscript = transcriptText.innerHTML;
                syncLandscapeWords(false);

                // Replace the element with a fresh clone to purge iOS's undo history.
                // Setting contentEditable=false alone doesn't clear the undo stack,
                // so shake-to-undo would still trigger the system dialog.
                const parent = transcriptText.parentNode;
                const fresh = transcriptText.cloneNode(true);
                fresh.contentEditable = 'false';
                fresh.blur();
                parent.replaceChild(fresh, transcriptText);
                transcriptText = fresh;

                header.classList.remove('edit-mode');
                transcriptContainer.classList.remove('edit-mode');
                if (transcriptText.querySelector('.placeholder')) {
                    finalTranscript = '';
                }
                editButton.disabled = !finalTranscript;
                copyButton.disabled = !finalTranscript;
                fullscreenButton.disabled = !finalTranscript;
                quickActions.classList.toggle('visible', !!finalTranscript);
                refreshCorrectAvail();
            }

            editButton.addEventListener('click', enterEditMode);
            editDoneButton.addEventListener('click', exitEditMode);

            // Fullscreen mode - use large text for readability (min 96px desktop, 72px mobile, or user's preference if larger)
            fullscreenButton.addEventListener('click', () => {
                fullscreenText.innerHTML = finalTranscript;
                const minSize = window.innerWidth < 768 ? 60 : 96;
                const fullscreenFontSize = Math.max(currentFontSize, minSize);
                fullscreenText.style.fontSize = fullscreenFontSize + 'px';
                fullscreenOverlay.classList.add('visible');
            });

            fullscreenClose.addEventListener('click', () => {
                fullscreenOverlay.classList.remove('visible');
            });

            // Recognition event handlers
            recognition.onstart = () => {
                isListening = true;
                if (correctMode) setCorrectMode(false);   // recording and correcting are mutually exclusive
                hidePopover();
                transcriptContainer.classList.add('listening');
                statusDot.classList.add('active');
                statusText.textContent = 'Listening...';
                errorMessage.style.display = 'none';
                lastSpeechTime = Date.now(); // Reset pause timer
                lastProcessedIndex = 0; // Reset for new recognition session

                // Clear placeholder if present
                if (transcriptText.querySelector('.placeholder')) {
                    transcriptText.innerHTML = '';
                }
                updateFontSize(currentFontSize); // Ensure font size is applied
                if (landscapeActive) {
                    document.getElementById('landscapeInterim').textContent = '';
                    syncLandscapeWords(false);
                    updateLandscapeDisplay();
                }
            };

            recognition.onend = () => {
                isListening = false;
                isHoldToSpeak = false;
                holdButton.classList.remove('holding');
                transcriptContainer.classList.remove('listening');
                statusDot.classList.remove('active');
                statusText.textContent = 'Ready';
                refreshCorrectAvail();
                if (landscapeActive) {
                    document.getElementById('landscapeInterim').textContent = '';
                    updateLandscapeDisplay();
                }
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                const now = Date.now();

                // Check for pause and add separator if needed
                if (pauseTimer) {
                    clearTimeout(pauseTimer);
                }

                // If more than PAUSE_THRESHOLD has passed since last speech, add separator
                if (now - lastSpeechTime > PAUSE_THRESHOLD && finalTranscript.trim().length > 0) {
                    // Check if the last element isn't already a separator
                    if (!finalTranscript.endsWith('<hr class="speech-separator">')) {
                        finalTranscript += '<hr class="speech-separator">';
                    }
                }

                // On Android Chrome, event.resultIndex is often stuck at 0, causing all
                // previously-processed final results to be re-delivered on every event.
                // We track lastProcessedIndex ourselves to skip results we've already appended.
                const startIndex = Math.max(event.resultIndex, lastProcessedIndex);

                for (let i = startIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;

                    if (event.results[i].isFinal) {
                        // Check for voice commands in the transcript
                        const wasCommandDetected = detectVoiceCommand(finalTranscript + transcript + ' ');

                        // Only add to transcript if no command was detected
                        if (!wasCommandDetected) {
                            finalTranscript += transcript + ' ';
                            lastSpeechTime = now;
                        }
                        lastProcessedIndex = i + 1;
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // Update display (word-wrapping applied only while in correction mode)
                renderTranscript(interimTranscript);
                editButton.disabled = !finalTranscript;
                copyButton.disabled = !finalTranscript;
                fullscreenButton.disabled = !finalTranscript;
                quickActions.classList.toggle('visible', !!finalTranscript);

                // Auto-scroll to bottom
                transcriptContainer.scrollTop = transcriptContainer.scrollHeight;

                // Sync landscape overlay — auto-advance to newest word while listening
                syncLandscapeWords(true);
                if (landscapeActive) {
                    document.getElementById('landscapeInterim').textContent = interimTranscript || '';
                }

                // Update last speech time for any speech activity
                lastSpeechTime = now;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);

                let errorMsg = '';
                switch (event.error) {
                    case 'aborted':
                        return;
                    case 'no-speech':
                        errorMsg = 'No speech detected. Please try speaking again.';
                        break;
                    case 'audio-capture':
                        return;
                    case 'not-allowed':
                        errorMsg = 'Microphone access denied. Please allow microphone access in your browser settings.';
                        break;
                    case 'network':
                        errorMsg = 'Network error occurred. Please check your internet connection.';
                        break;
                    default:
                        errorMsg = `Error occurred: ${event.error}. Please try again.`;
                }

                errorMessage.textContent = errorMsg;
                errorMessage.style.display = 'block';

                // Auto-hide error after 5 seconds for non-critical errors
                if (event.error === 'no-speech') {
                    setTimeout(() => {
                        errorMessage.style.display = 'none';
                    }, 5000);
                }
            };

            // ============================================================
            // LANDSCAPE WORD-SWIPE FUNCTIONS
            // ============================================================

            function extractWords(htmlStr) {
                if (!htmlStr) return [];
                const tmp = document.createElement('div');
                tmp.innerHTML = htmlStr.replace(/<hr[^>]*>/gi, ' ');
                return (tmp.textContent || '').split(/\s+/).filter(w => w.length > 0);
            }

            function fitWordToScreen(word) {
                const wordEl = document.getElementById('landscapeWord');
                const areaEl = document.getElementById('landscapeWordArea');
                const availW = areaEl.clientWidth  - 32;
                const availH = areaEl.clientHeight - 40;
                if (!word || availW <= 0 || availH <= 0) {
                    wordEl.style.fontSize = '72px';
                    wordEl.textContent = word || '';
                    return;
                }
                wordEl.style.fontSize = '200px';
                wordEl.textContent = word;
                const scaleW = availW / wordEl.scrollWidth;
                const scaleH = availH / wordEl.scrollHeight;
                wordEl.style.fontSize = Math.max(20, Math.floor(200 * Math.min(scaleW, scaleH))) + 'px';
            }

            function updateLandscapeDisplay() {
                const wordEl    = document.getElementById('landscapeWord');
                const counterEl = document.getElementById('landscapeCounter');
                const total = landscapeWords.length;
                if (total === 0) {
                    wordEl.className = 'landscape-word landscape-placeholder';
                    wordEl.style.fontSize = '28px';
                    wordEl.textContent = isListening ? 'Listening…' : 'Hold to speak';
                    counterEl.textContent = '';
                    return;
                }
                wordEl.className = 'landscape-word';
                landscapeIndex = Math.max(0, Math.min(landscapeIndex, total - 1));
                fitWordToScreen(landscapeWords[landscapeIndex]);
                counterEl.textContent = `${landscapeIndex + 1} / ${total}`;
            }

            function syncLandscapeWords(autoAdvance = false) {
                if (!landscapeActive) return;
                const newWords = extractWords(finalTranscript);
                const prevTotal = landscapeWords.length;
                landscapeWords = newWords;
                if (autoAdvance && newWords.length > prevTotal) {
                    landscapeIndex = newWords.length - 1;
                } else if (landscapeIndex >= newWords.length && newWords.length > 0) {
                    landscapeIndex = newWords.length - 1;
                }
                updateLandscapeDisplay();
            }

            function navigateLandscapeWord(delta) {
                if (landscapeWords.length === 0) return;
                landscapeIndex = Math.max(0, Math.min(landscapeWords.length - 1, landscapeIndex + delta));
                updateLandscapeDisplay();
            }

            function checkOrientation() {
                const isPhoneLandscape = window.matchMedia('(orientation: landscape)').matches
                                         && window.innerHeight < 500;
                if (isPhoneLandscape && !landscapeActive) {
                    landscapeActive = true;
                    landscapeWords = extractWords(finalTranscript);
                    landscapeIndex = Math.max(0, landscapeWords.length - 1);
                    landscapeOverlay.classList.add('visible');
                    updateLandscapeDisplay();
                } else if (!isPhoneLandscape && landscapeActive) {
                    landscapeActive = false;
                    landscapeOverlay.classList.remove('visible');
                }
            }

            // Orientation / resize listeners
            window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 150));
            window.addEventListener('resize', checkOrientation);
            checkOrientation(); // run on load in case page opens in landscape

            // Swipe detection on landscape overlay
            landscapeOverlay.addEventListener('touchstart', (e) => {
                if (e.target.closest('.landscape-hold-button')) return;
                landscapeTouchStartX = e.touches[0].clientX;
                landscapeTouchStartY = e.touches[0].clientY;
            }, { passive: true });

            landscapeOverlay.addEventListener('touchend', (e) => {
                if (e.target.closest('.landscape-hold-button')) return;
                const dx = e.changedTouches[0].clientX - landscapeTouchStartX;
                const dy = e.changedTouches[0].clientY - landscapeTouchStartY;
                if (Math.abs(dx) > LANDSCAPE_SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
                    navigateLandscapeWord(dx < 0 ? 1 : -1);
                }
            }, { passive: true });

            // ============================================================
            // WORD CORRECTION  (tap a word → most-likely replacements)
            // ============================================================

            let correctMode = false;
            let activeWordSpan = null;       // the .word span currently being corrected
            let activeWordIndex = -1;        // its index among all transcript words

            const correctButton      = document.getElementById('correctButton');
            const correctPopover      = document.getElementById('correctPopover');
            const correctPopoverHeader= document.getElementById('correctPopoverHeader');
            const correctPopoverList  = document.getElementById('correctPopoverList');
            const addToMyWordsButton  = document.getElementById('addToMyWordsButton');
            const manageMyWordsButton = document.getElementById('manageMyWordsButton');

            // ---- Custom dictionaries (persisted in localStorage) ----
            // Replacement pairs: { heardLowercase: "Correct Word" }  (always win)
            // Vocabulary: ["Name", "Term", ...]  (surfaced as phonetic suggestions)
            let customPairs = {};
            let customVocab = [];
            try { customPairs = JSON.parse(localStorage.getItem('nannaCustomCorrections')) || {}; } catch (e) { customPairs = {}; }
            try { customVocab = JSON.parse(localStorage.getItem('nannaCustomVocab')) || []; } catch (e) { customVocab = []; }
            if (typeof customPairs !== 'object' || customPairs === null) customPairs = {};
            if (!Array.isArray(customVocab)) customVocab = [];

            function saveCustomDicts() {
                try {
                    localStorage.setItem('nannaCustomCorrections', JSON.stringify(customPairs));
                    localStorage.setItem('nannaCustomVocab', JSON.stringify(customVocab));
                } catch (e) {}
            }

            // ---- Phonetic suggestion engine ----
            const phoneticIndex = new Map();   // metaphone code -> [{ word, rank }]
            const vocabLowerSet = new Set();   // lowercased custom-vocab words (for boost)
            let indexBuilt = false;

            function phoneticCodes(word) {
                if (typeof doubleMetaphone !== 'function') return [];
                const codes = doubleMetaphone(word);
                const out = [];
                for (const c of codes) {
                    if (c && out.indexOf(c) === -1) out.push(c);
                }
                return out;
            }

            function addToIndex(word, rank) {
                for (const code of phoneticCodes(word)) {
                    let bucket = phoneticIndex.get(code);
                    if (!bucket) { bucket = []; phoneticIndex.set(code, bucket); }
                    bucket.push({ word: word, rank: rank });
                }
            }

            function buildPhoneticIndex() {
                phoneticIndex.clear();
                vocabLowerSet.clear();
                const list = window.NANNA_WORDLIST || [];
                for (let i = 0; i < list.length; i++) {
                    addToIndex(list[i], i);   // rank = frequency position (lower = more common)
                }
                // Custom vocabulary gets top priority (rank -1)
                for (const w of customVocab) {
                    const lower = w.toLowerCase();
                    if (vocabLowerSet.has(lower)) continue;
                    vocabLowerSet.add(lower);
                    addToIndex(lower, -1);
                }
                indexBuilt = true;
            }

            function rebuildVocabInIndex() {
                // Vocabulary changed — cheapest correct path is a full rebuild.
                if (indexBuilt) buildPhoneticIndex();
            }

            function levenshtein(a, b) {
                const m = a.length, n = b.length;
                if (m === 0) return n;
                if (n === 0) return m;
                let prev = new Array(n + 1);
                let curr = new Array(n + 1);
                for (let j = 0; j <= n; j++) prev[j] = j;
                for (let i = 1; i <= m; i++) {
                    curr[0] = i;
                    for (let j = 1; j <= n; j++) {
                        const cost = a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1;
                        curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
                    }
                    const tmp = prev; prev = curr; curr = tmp;
                }
                return prev[n];
            }

            // Split a raw token into [leading, core, trailing] so punctuation/case is preserved.
            function splitToken(raw) {
                const m = raw.match(/^([^A-Za-z']*)([A-Za-z']*)(.*)$/);
                if (!m) return { lead: '', core: raw, trail: '' };
                return { lead: m[1], core: m[2], trail: m[3] };
            }

            function applyCasing(original, replacement) {
                if (!original) return replacement;
                if (original === original.toUpperCase() && original.length > 1) {
                    return replacement.toUpperCase();
                }
                if (original[0] === original[0].toUpperCase()) {
                    return replacement.charAt(0).toUpperCase() + replacement.slice(1);
                }
                return replacement;
            }

            // Return up to `max` ranked replacement suggestions for a raw word token.
            function getSuggestions(rawWord, max) {
                if (!indexBuilt) buildPhoneticIndex();
                max = max || 6;
                const parts = splitToken(rawWord);
                const core = parts.core;
                const lower = core.toLowerCase().replace(/[^a-z']/g, '');
                const results = [];
                const seen = new Set();

                function push(word, score, tag) {
                    const cased = applyCasing(core, word);
                    const key = cased.toLowerCase();
                    if (key === lower) return;          // skip the original word itself
                    if (seen.has(key)) return;
                    seen.add(key);
                    results.push({ word: cased, score: score, tag: tag });
                }

                // 1. Explicit replacement pairs always win.
                if (Object.prototype.hasOwnProperty.call(customPairs, lower)) {
                    push(customPairs[lower], 1e9, 'my word');
                }

                if (!lower) return results.slice(0, max);

                // 2. Phonetic candidates sharing a Double Metaphone code.
                const candidates = new Map();   // word -> best rank
                for (const code of phoneticCodes(lower)) {
                    const bucket = phoneticIndex.get(code);
                    if (!bucket) continue;
                    for (const entry of bucket) {
                        const prev = candidates.get(entry.word);
                        if (prev === undefined || entry.rank < prev) {
                            candidates.set(entry.word, entry.rank);
                        }
                    }
                }

                // 3. Score: closeness (edit distance) dominates, frequency & custom-vocab break ties.
                const scored = [];
                candidates.forEach((rank, word) => {
                    if (word === lower) return;
                    const dist = levenshtein(lower, word);
                    if (dist > 4) return;                      // too dissimilar to be a likely mishearing
                    const isVocab = rank < 0;
                    const freqScore = isVocab ? 1000 : Math.max(0, 100 - rank / 50);
                    const score = (isVocab ? 500 : 0) + (5 - dist) * 100 + freqScore;
                    scored.push({ word: word, score: score, tag: isVocab ? 'my word' : null });
                });
                scored.sort((a, b) => b.score - a.score);
                for (const s of scored) push(s.word, s.score, s.tag);

                return results.slice(0, max);
            }

            // ---- Render transcript with optional tappable word spans ----
            function escapeHtml(s) {
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            // Wrap every whitespace-delimited word in finalTranscript HTML with a
            // <span class="word" data-wi="N"> while preserving <hr> separators.
            function wrapWordsHtml(html) {
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                let wi = 0;
                const walk = (node) => {
                    const children = Array.prototype.slice.call(node.childNodes);
                    for (const child of children) {
                        if (child.nodeType === Node.TEXT_NODE) {
                            const text = child.nodeValue;
                            if (!/\S/.test(text)) continue;
                            const frag = document.createDocumentFragment();
                            // Split keeping whitespace so spacing is preserved exactly.
                            const tokens = text.split(/(\s+)/);
                            for (const tok of tokens) {
                                if (tok === '') continue;
                                if (/^\s+$/.test(tok)) {
                                    frag.appendChild(document.createTextNode(tok));
                                } else {
                                    const span = document.createElement('span');
                                    span.className = 'word';
                                    span.setAttribute('data-wi', String(wi++));
                                    span.textContent = tok;
                                    frag.appendChild(span);
                                }
                            }
                            node.replaceChild(frag, child);
                        } else if (child.nodeType === Node.ELEMENT_NODE && child.className !== 'interim-text') {
                            walk(child);
                        }
                    }
                };
                walk(tmp);
                return tmp.innerHTML;
            }

            // Single source of truth for painting the transcript element.
            function renderTranscript(interimTranscript) {
                const base = (correctMode && !isEditing && finalTranscript)
                    ? wrapWordsHtml(finalTranscript)
                    : finalTranscript;
                const interim = interimTranscript
                    ? `<span class="interim-text">${interimTranscript}</span>`
                    : '';
                const html = base + interim;
                transcriptText.innerHTML = html ||
                    `<div class="placeholder">${isListening ? 'Listening...' : 'Hold to speak'}</div>`;
                refreshCorrectAvail();
            }

            function refreshCorrectAvail() {
                correctButton.disabled = !finalTranscript || isListening || isEditing;
                if (correctButton.disabled && correctMode) setCorrectMode(false);
            }

            // Replace the Nth transcript word in finalTranscript with `newCore`,
            // operating on text nodes so <hr> separators and structure are preserved.
            function replaceWordAt(targetIndex, newCore) {
                const tmp = document.createElement('div');
                tmp.innerHTML = finalTranscript;
                let wi = 0;
                let done = false;
                const walk = (node) => {
                    const children = Array.prototype.slice.call(node.childNodes);
                    for (const child of children) {
                        if (done) return;
                        if (child.nodeType === Node.TEXT_NODE) {
                            const text = child.nodeValue;
                            if (!/\S/.test(text)) continue;
                            const tokens = text.split(/(\s+)/);
                            let changed = false;
                            for (let k = 0; k < tokens.length; k++) {
                                if (/^\s*$/.test(tokens[k])) continue;
                                if (wi === targetIndex) {
                                    const parts = splitToken(tokens[k]);
                                    tokens[k] = parts.lead + newCore + parts.trail;
                                    changed = true;
                                    done = true;
                                    wi++;
                                    break;
                                }
                                wi++;
                            }
                            if (changed) child.nodeValue = tokens.join('');
                        } else if (child.nodeType === Node.ELEMENT_NODE && child.className !== 'interim-text') {
                            walk(child);
                        }
                        if (done) return;
                    }
                };
                walk(tmp);
                finalTranscript = tmp.innerHTML;
            }

            // ---- Popover ----
            function hidePopover() {
                correctPopover.classList.remove('visible');
                if (activeWordSpan) activeWordSpan.classList.remove('selected');
                activeWordSpan = null;
                activeWordIndex = -1;
            }

            function positionPopover(targetRect) {
                correctPopover.style.visibility = 'hidden';
                correctPopover.classList.add('visible');
                const pop = correctPopover.getBoundingClientRect();
                const margin = 8;
                let left = targetRect.left + targetRect.width / 2 - pop.width / 2;
                left = Math.max(margin, Math.min(left, window.innerWidth - pop.width - margin));
                let top = targetRect.bottom + margin;
                if (top + pop.height > window.innerHeight - margin) {
                    top = targetRect.top - pop.height - margin;   // flip above
                }
                if (top < margin) top = margin;
                correctPopover.style.left = left + 'px';
                correctPopover.style.top = top + 'px';
                correctPopover.style.visibility = 'visible';
            }

            function openPopoverForWord(span) {
                const raw = span.textContent;
                activeWordSpan = span;
                activeWordIndex = parseInt(span.getAttribute('data-wi'), 10);
                span.classList.add('selected');

                correctPopoverHeader.innerHTML = 'Replace <b>' + escapeHtml(raw) + '</b>';
                correctPopoverList.innerHTML = '';

                const suggestions = getSuggestions(raw, 6);
                if (suggestions.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'correct-suggestion empty';
                    empty.textContent = 'No suggestions found';
                    correctPopoverList.appendChild(empty);
                } else {
                    for (const s of suggestions) {
                        const btn = document.createElement('button');
                        btn.className = 'correct-suggestion';
                        const label = document.createElement('span');
                        label.textContent = s.word;
                        btn.appendChild(label);
                        if (s.tag) {
                            const tag = document.createElement('span');
                            tag.className = 'tag';
                            tag.textContent = s.tag;
                            btn.appendChild(tag);
                        }
                        btn.addEventListener('click', () => chooseReplacement(s.word));
                        correctPopoverList.appendChild(btn);
                    }
                }

                // Always offer to keep the original.
                const keep = document.createElement('button');
                keep.className = 'correct-suggestion keep';
                keep.textContent = 'Keep "' + raw + '"';
                keep.addEventListener('click', hidePopover);
                correctPopoverList.appendChild(keep);

                positionPopover(span.getBoundingClientRect());
            }

            function chooseReplacement(newWord) {
                if (activeWordIndex < 0) { hidePopover(); return; }
                replaceWordAt(activeWordIndex, newWord);
                hidePopover();
                renderTranscript('');
                syncLandscapeWords(false);
            }

            // Tap handling for word spans (delegated)
            transcriptText.addEventListener('click', (e) => {
                if (!correctMode || isEditing) return;
                const span = e.target.closest && e.target.closest('.word');
                if (!span || !transcriptText.contains(span)) return;
                e.preventDefault();
                e.stopPropagation();
                if (span === activeWordSpan) { hidePopover(); return; }
                hidePopover();
                openPopoverForWord(span);
            });

            // Dismiss popover when tapping elsewhere
            document.addEventListener('click', (e) => {
                if (!correctPopover.classList.contains('visible')) return;
                if (correctPopover.contains(e.target)) return;
                if (e.target.closest && e.target.closest('.word')) return;
                hidePopover();
            });

            function setCorrectMode(on) {
                if (on === correctMode) return;
                correctMode = on;
                correctButton.classList.toggle('active', on);
                transcriptContainer.classList.toggle('correct-mode', on);
                if (!on) hidePopover();
                renderTranscript('');
            }

            correctButton.addEventListener('click', () => {
                if (correctButton.disabled) return;
                setCorrectMode(!correctMode);
            });

            // ---- "My words" manager modal ----
            const myWordsOverlay  = document.getElementById('myWordsOverlay');
            const myWordsClose     = document.getElementById('myWordsClose');
            const pairHeardInput   = document.getElementById('pairHeardInput');
            const pairReplaceInput = document.getElementById('pairReplaceInput');
            const addPairButton    = document.getElementById('addPairButton');
            const pairsList        = document.getElementById('pairsList');
            const vocabInput       = document.getElementById('vocabInput');
            const addVocabButton   = document.getElementById('addVocabButton');
            const vocabList        = document.getElementById('vocabList');

            function renderMyWordsLists() {
                pairsList.innerHTML = '';
                const keys = Object.keys(customPairs);
                if (keys.length === 0) {
                    const li = document.createElement('li');
                    li.className = 'my-words-empty';
                    li.textContent = 'No replacement pairs yet.';
                    pairsList.appendChild(li);
                } else {
                    for (const heard of keys) {
                        const li = document.createElement('li');
                        const label = document.createElement('span');
                        label.textContent = heard + ' → ' + customPairs[heard];
                        const rm = document.createElement('button');
                        rm.className = 'remove-word';
                        rm.textContent = '✕';
                        rm.addEventListener('click', () => {
                            delete customPairs[heard];
                            saveCustomDicts();
                            renderMyWordsLists();
                        });
                        li.appendChild(label);
                        li.appendChild(rm);
                        pairsList.appendChild(li);
                    }
                }

                vocabList.innerHTML = '';
                if (customVocab.length === 0) {
                    const li = document.createElement('li');
                    li.className = 'my-words-empty';
                    li.textContent = 'No custom words yet.';
                    vocabList.appendChild(li);
                } else {
                    for (const word of customVocab.slice()) {
                        const li = document.createElement('li');
                        const label = document.createElement('span');
                        label.textContent = word;
                        const rm = document.createElement('button');
                        rm.className = 'remove-word';
                        rm.textContent = '✕';
                        rm.addEventListener('click', () => {
                            customVocab = customVocab.filter(w => w !== word);
                            saveCustomDicts();
                            rebuildVocabInIndex();
                            renderMyWordsLists();
                        });
                        li.appendChild(label);
                        li.appendChild(rm);
                        vocabList.appendChild(li);
                    }
                }
            }

            function openMyWords(prefillHeard) {
                pairHeardInput.value = prefillHeard ? prefillHeard.toLowerCase().replace(/[^a-z']/g, '') : '';
                pairReplaceInput.value = '';
                vocabInput.value = '';
                renderMyWordsLists();
                myWordsOverlay.classList.add('visible');
                (prefillHeard ? pairReplaceInput : pairHeardInput).focus();
            }

            function closeMyWords() {
                myWordsOverlay.classList.remove('visible');
            }

            addPairButton.addEventListener('click', () => {
                const heard = pairHeardInput.value.trim().toLowerCase().replace(/[^a-z']/g, '');
                const replace = pairReplaceInput.value.trim();
                if (!heard || !replace) return;
                customPairs[heard] = replace;
                saveCustomDicts();
                pairHeardInput.value = '';
                pairReplaceInput.value = '';
                renderMyWordsLists();
                pairHeardInput.focus();
            });

            addVocabButton.addEventListener('click', () => {
                const word = vocabInput.value.trim();
                if (!word) return;
                if (!customVocab.some(w => w.toLowerCase() === word.toLowerCase())) {
                    customVocab.push(word);
                    saveCustomDicts();
                    rebuildVocabInIndex();
                }
                vocabInput.value = '';
                renderMyWordsLists();
                vocabInput.focus();
            });

            // Enter-to-add convenience
            pairReplaceInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addPairButton.click(); });
            vocabInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addVocabButton.click(); });

            myWordsClose.addEventListener('click', closeMyWords);
            myWordsOverlay.addEventListener('click', (e) => {
                if (e.target === myWordsOverlay) closeMyWords();
            });

            manageMyWordsButton.addEventListener('click', () => {
                hidePopover();
                openMyWords(null);
            });

            addToMyWordsButton.addEventListener('click', () => {
                const heard = activeWordSpan ? activeWordSpan.textContent : '';
                hidePopover();
                openMyWords(heard);
            });

            // Reposition/dismiss popover on scroll & resize
            transcriptContainer.addEventListener('scroll', hidePopover);
            window.addEventListener('resize', hidePopover);

        }
    </script>
</body>
</html>
