<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nanna - Speech to Text</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Nanna - Speech to Text">
    <meta name="description" content="Real-time speech to text for deaf and hearing-impaired users">

    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nanna">

    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icon.png">

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Theme Colors -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            /* Light mode colors */
            --bg-primary: #f5f5f5;
            --bg-secondary: white;
            --btn-subtle-bg: #e2e2e2;
            --btn-subtle-hover-bg: #d6ebff;
            --btn-subtle-color: #000000;
            --text-primary: #212121;
            --text-secondary: #757575;
            --text-placeholder: #bdbdbd;
            --border-color: #ddd;
            --shadow: rgba(0, 0, 0, 0.1);
            --shadow-hover: rgba(0, 0, 0, 0.15);
            --separator-color: #ddd;
            --scrollbar-track: #f1f1f1;
            --scrollbar-thumb: #888;
            --scrollbar-thumb-hover: #555;
        }

        body.dark-mode {
            /* Dark mode colors */
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --btn-subtle-bg: #424242;
            --btn-subtle-color: #ffffff;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-placeholder: #666;
            --border-color: #444;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.5);
            --separator-color: #444;
            --scrollbar-track: #1a1a1a;
            --scrollbar-thumb: #555;
            --scrollbar-thumb-hover: #777;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: var(--bg-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease;
            /* Support for iPhone notch and safe areas */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: var(--bg-secondary);
            box-shadow: 0 2px 8px var(--shadow);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .header-left {
            display: flex;
            gap: 15px;
        }

        .header-right {
            display: flex;
            gap: 15px;
        }
        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 0 0 0 rgba(244, 67, 54, 0.7);
            }
            50% {
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 0 0 15px rgba(244, 67, 54, 0);
            }
        }

        .clear-button, .edit-button {
            background: rgba(226, 226, 226, 1);
            color: rgba(0, 0, 0, 1);
            border: none; 
            font-size: 18px;
            font-weight: 400;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
            width: 60px;
            flex-shrink: 0;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clear-button:hover, .edit-button:hover {
            background: var(--btn-subtle-hover-bg);
            transform: translateY(-2px);
            box-shadow: none;
        }

        .font-controls {
            display: flex;
            gap: 1px;
            align-items: center;
        }

        .font-button {
            background: var(--btn-subtle-bg);
            color: var(--btn-subtle-color);
            border: none;
            padding: 12px 0;
            font-size: 20px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 50px;
            width: 44px;
            height: 44px;
        }

        #decreaseFontButton {
            border-radius: 8px 0 0 8px;
        }

        #increaseFontButton {
            border-radius: 0 8px 8px 0;
        }

        .font-button:hover {
            background: #d6ebff;
            transform: translateY(-2px);
        }

        .font-button:active {
            transform: translateY(0);
        }

        .font-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .font-size-label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
            white-space: nowrap;
        }

        .copy-button { 
            background: rgba(237, 237, 237, 1);
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .copy-button:hover {
            background: #F57C00;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .copy-button.copied {
            background: #4CAF50;
        }

        #copyButtonText {
            display: none;
        }

        .speech-separator {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--separator-color), transparent);
            margin: 20px 0;
            opacity: 0.6;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 500;
            color: #666;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            transition: background 0.3s ease;
        }

        .status-dot.active {
            background: #f44336;
        }
        #statusText {
            display: none;
        }
        .transcript-container {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: var(--bg-secondary);
            margin: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            border: 4px solid transparent;
        }

        .transcript-container.listening {
            border: 4px solid #f44336;
            box-shadow: 0 4px 12px var(--shadow-hover);
        }

        .transcript-text {
            font-size: 48px;
            line-height: 1.6;
            color: var(--text-primary);
            word-wrap: break-word;
            white-space: pre-wrap;
            transition: color 0.3s ease;
        }

        .interim-text {
            color: var(--text-secondary);
            font-style: italic;
        }

        .error-message {
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            border: 2px solid #ffc107;
            font-size: 18px;
            text-align: center;
        }

        .placeholder {
            color: var(--text-placeholder);
            font-size: 32px;
            text-align: center;
            padding: 60px 20px;
            font-style: italic;
            transition: color 0.3s ease;
        }

        @media (max-width: 768px) {
            .transcript-text {
                font-size: 36px;
            }

            .header {
                padding: 15px;
            }

            .transcript-container {
                padding: 20px;
                margin: 15px;
            }

            .placeholder {
                font-size: 24px;
                padding: 40px 15px;
            }
        }

        @media (max-width: 480px) {
            .transcript-text {
                font-size: 28px;
            }

            .placeholder {
                font-size: 20px;
            }

            .header {
                gap: 10px;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .transcript-text {
                font-weight: 600;
            }

            .transcript-container {
                border: 3px solid #000;
            }
        }

        /* Scrollbar styling */
        .transcript-container::-webkit-scrollbar {
            width: 12px;
        }

        .transcript-container::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 6px;
        }

        .transcript-container::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 6px;
        }

        .transcript-container::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* Voice command indicator */
        .command-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(76, 175, 80, 0.95);
            color: white;
            padding: 30px 50px;
            border-radius: 12px;
            font-size: 32px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .command-indicator.show {
            opacity: 1;
        }

        .command-indicator.error {
            background: rgba(244, 67, 54, 0.95);
        }

        /* Theme toggle button */
        .theme-toggle {
            background: #424242;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            width: 44px;
            height: 44px;
        }

        .theme-toggle:hover {
            background: #616161;
            transform: translateY(-2px);
            box-shadow: none;
        }

        .theme-toggle:active {
            transform: translateY(0);
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
        }

        .hold-button {
            display: inline-block;
            background: #2196F3;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .hold-button.holding {
            background: #f44336;
            animation: pulse 1.5s infinite;
        }

        @media (max-width: 768px) {
            .header-left {
                width: 100%;
                flex-wrap: nowwrap;
            }
            .hide-on-mobile {
                display: none;
            }
            .hold-button {
                width: 100%;
            }
        }  
        .svg-icon {
            width: 24px;
            height: 24px;
        }

        /* Edit toolbar - sticky bar shown during editing */
        .edit-toolbar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #1976D2;
            color: white;
            flex-shrink: 0;
        }

        .edit-toolbar.visible {
            display: flex;
        }

        .edit-toolbar-label {
            font-size: 17px;
            font-weight: 600;
            opacity: 0.9;
        }

        .edit-done-button {
            background: white;
            color: #1976D2;
            border: none;
            padding: 10px 28px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            min-height: 44px;
            min-width: 80px;
        }

        .edit-done-button:active {
            opacity: 0.85;
        }

        /* Make transcript editable */
        .transcript-text[contenteditable="true"] {
            outline: none;
            caret-color: #1976D2;
        }
        .edit-button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <button class="hold-button" id="holdButton">Hold to Speak</button>
            <button class="clear-button" id="clearButton"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="svg-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg></button>
            <button class="edit-button" id="editButton" title="Edit transcript" disabled><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="svg-icon"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" /></svg></button>
        </div>
        <div class="header-right hide-on-mobile">
            <button class="copy-button" id="copyButton" title="Copy text to clipboard">
                <span>📋</span>
                <span id="copyButtonText">Copy</span>
            </button>
            <div class="font-controls">
                <span class="font-size-label sr-only">Text Size:</span>
                <button class="font-button" id="decreaseFontButton" title="Decrease text size">A-</button>
                <button class="font-button" id="increaseFontButton" title="Increase text size">A+</button>
            </div>
            <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">
                <span id="themeIcon">🌙</span>
            </button>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Ready</span>
            </div>
        </div>
    </div>

    <div class="edit-toolbar" id="editToolbar">
        <span class="edit-toolbar-label">Editing</span>
        <button class="edit-done-button" id="editDoneButton">Done</button>
    </div>

    <div class="transcript-container" id="transcriptContainer">
        <div class="transcript-text" id="transcriptText">
            <div class="placeholder">Hold to speak</div>
        </div>
    </div>

    <div class="error-message" id="errorMessage" style="display: none;"></div>

    <div class="command-indicator" id="commandIndicator"></div>

    <script>
        // Check for browser support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            document.getElementById('errorMessage').textContent =
                'Sorry, your browser does not support speech recognition. Please use Chrome, Edge, or Safari.';
            document.getElementById('errorMessage').style.display = 'block';
            const holdBtn = document.getElementById('holdButton');
            holdBtn.disabled = true;
            holdBtn.style.opacity = '0.5';
            holdBtn.style.cursor = 'not-allowed';
        } else {
            // Initialize speech recognition
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            // Request mic permission on every load so the prompt appears immediately
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => stream.getTracks().forEach(t => t.stop()))
                .catch(() => {});

            let isListening = false;
            let isHoldToSpeak = false;
            let finalTranscript = '';

            const holdButton = document.getElementById('holdButton');
            const clearButton = document.getElementById('clearButton');
            const transcriptText = document.getElementById('transcriptText');
            const transcriptContainer = document.getElementById('transcriptContainer');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const errorMessage = document.getElementById('errorMessage');
            const increaseFontButton = document.getElementById('increaseFontButton');
            const decreaseFontButton = document.getElementById('decreaseFontButton');
            const copyButton = document.getElementById('copyButton');
            const copyButtonText = document.getElementById('copyButtonText');
            const commandIndicator = document.getElementById('commandIndicator');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const editButton = document.getElementById('editButton');
            const editToolbar = document.getElementById('editToolbar');
            const editDoneButton = document.getElementById('editDoneButton');

            // Theme management
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeIcon.textContent = '☀️';
            }

            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                themeIcon.textContent = isDark ? '☀️' : '🌙';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });

            // Voice commands configuration
            const voiceCommands = {
                'clear text': () => {
                    finalTranscript = '';
                    transcriptText.innerHTML = isListening ?
                        '<div class="placeholder">Listening...</div>' :
                        '<div class="placeholder">Hold to speak</div>';
                    showCommandFeedback('✓ Text Cleared');
                }
            };

            // Function to show command feedback
            function showCommandFeedback(message, isError = false) {
                commandIndicator.textContent = message;
                commandIndicator.classList.remove('error');
                if (isError) {
                    commandIndicator.classList.add('error');
                }
                commandIndicator.classList.add('show');

                setTimeout(() => {
                    commandIndicator.classList.remove('show');
                }, 1500);
            }

            // Function to detect and execute voice commands
            function detectVoiceCommand(text) {
                const lowerText = text.toLowerCase().trim();

                for (const [command, action] of Object.entries(voiceCommands)) {
                    if (lowerText.includes(command)) {
                        // Execute the command
                        action();
                        return true;
                    }
                }
                return false;
            }

            // Pause detection
            let lastSpeechTime = Date.now();
            let pauseTimer = null;
            const PAUSE_THRESHOLD = 1000; // 1 second

            // Font size management
            const MIN_FONT_SIZE = 20;
            const MAX_FONT_SIZE = 100;
            const FONT_STEP = 4;
            let currentFontSize = parseInt(localStorage.getItem('transcriptFontSize')) || 48;

            function updateFontSize(size) {
                currentFontSize = Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, size));
                transcriptText.style.fontSize = currentFontSize + 'px';
                localStorage.setItem('transcriptFontSize', currentFontSize);

                // Update placeholder size to be proportional
                const placeholder = transcriptText.querySelector('.placeholder');
                if (placeholder) {
                    placeholder.style.fontSize = Math.max(20, currentFontSize * 0.67) + 'px';
                }

                // Update button states
                decreaseFontButton.disabled = currentFontSize <= MIN_FONT_SIZE;
                increaseFontButton.disabled = currentFontSize >= MAX_FONT_SIZE;
            }

            // Initialize font size on load
            updateFontSize(currentFontSize);

            // Font size button handlers
            increaseFontButton.addEventListener('click', () => {
                updateFontSize(currentFontSize + FONT_STEP);
            });

            decreaseFontButton.addEventListener('click', () => {
                updateFontSize(currentFontSize - FONT_STEP);
            });

            // Copy button click handler
            copyButton.addEventListener('click', async () => {
                try {
                    // Get only the text content, excluding HTML tags
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = finalTranscript;

                    // Remove HR elements and get text
                    const hrs = tempDiv.querySelectorAll('hr');
                    hrs.forEach(hr => hr.replaceWith('\n\n'));

                    let textToCopy = tempDiv.textContent.trim();

                    if (!textToCopy) {
                        return; // Nothing to copy
                    }

                    await navigator.clipboard.writeText(textToCopy);

                    // Show feedback
                    copyButton.classList.add('copied');
                    copyButtonText.textContent = 'Copied!';

                    setTimeout(() => {
                        copyButton.classList.remove('copied');
                        copyButtonText.textContent = 'Copy';
                    }, 2000);
                } catch (error) {
                    console.error('Failed to copy:', error);
                    copyButtonText.textContent = 'Failed';
                    setTimeout(() => {
                        copyButtonText.textContent = 'Copy';
                    }, 2000);
                }
            });

            // Hold-to-speak button handlers
            function startHoldToSpeak() {
                if (isListening) return;
                isHoldToSpeak = true;
                holdButton.classList.add('holding');
                holdButton.textContent = 'Listening...';
                try {
                    recognition.start();
                } catch (error) {
                    console.error('Hold to speak start error:', error);
                    isHoldToSpeak = false;
                    holdButton.classList.remove('holding');
                    holdButton.textContent = 'Hold to Speak';
                }
            }

            function stopHoldToSpeak() {
                if (!isHoldToSpeak) return;
                isHoldToSpeak = false;
                holdButton.classList.remove('holding');
                holdButton.textContent = 'Hold to Speak';
                recognition.stop();
            }

            holdButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startHoldToSpeak();
            }, { passive: false });

            holdButton.addEventListener('touchend', (e) => {
                e.preventDefault();
                stopHoldToSpeak();
            }, { passive: false });

            holdButton.addEventListener('touchcancel', () => {
                stopHoldToSpeak();
            });

            // Mouse fallback for desktop testing
            holdButton.addEventListener('mousedown', startHoldToSpeak);
            holdButton.addEventListener('mouseup', stopHoldToSpeak);
            holdButton.addEventListener('mouseleave', stopHoldToSpeak);

            // Prevent context menu on long press
            holdButton.addEventListener('contextmenu', (e) => e.preventDefault());

            // Clear button click handler
            clearButton.addEventListener('click', () => {
                finalTranscript = '';
                if (isListening) {
                    transcriptText.innerHTML = '<div class="placeholder">Listening...</div>';
                } else {
                    transcriptText.innerHTML = '<div class="placeholder">Hold to speak</div>';
                }
                editButton.disabled = true;
                errorMessage.style.display = 'none';
                lastSpeechTime = Date.now(); // Reset pause timer
                updateFontSize(currentFontSize); // Update placeholder font size
            });

            // Edit mode
            let isEditing = false;
            let wasListeningBeforeEdit = false;

            function enterEditMode() {
                if (isEditing || !finalTranscript) return;
                isEditing = true;
                wasListeningBeforeEdit = isListening;
                if (isListening) recognition.stop();

                transcriptText.contentEditable = 'true';
                editToolbar.classList.add('visible');
                editButton.style.display = 'none';
                clearButton.style.display = 'none';
                holdButton.style.display = 'none';

                // Place cursor at end
                transcriptText.focus();
                const range = document.createRange();
                range.selectNodeContents(transcriptText);
                range.collapse(false);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }

            function exitEditMode() {
                if (!isEditing) return;
                isEditing = false;

                transcriptText.contentEditable = 'false';
                transcriptText.blur();
                editToolbar.classList.remove('visible');
                editButton.style.display = '';
                clearButton.style.display = '';
                holdButton.style.display = '';

                // Sync edits back to finalTranscript
                finalTranscript = transcriptText.innerHTML;
                if (transcriptText.querySelector('.placeholder')) {
                    finalTranscript = '';
                    editButton.disabled = true;
                }
            }

            editButton.addEventListener('click', enterEditMode);
            editDoneButton.addEventListener('click', exitEditMode);

            // Recognition event handlers
            recognition.onstart = () => {
                isListening = true;
                transcriptContainer.classList.add('listening');
                statusDot.classList.add('active');
                statusText.textContent = 'Listening...';
                errorMessage.style.display = 'none';
                lastSpeechTime = Date.now(); // Reset pause timer

                // Clear placeholder if present
                if (transcriptText.querySelector('.placeholder')) {
                    transcriptText.innerHTML = '';
                }
                updateFontSize(currentFontSize); // Ensure font size is applied
            };

            recognition.onend = () => {
                isListening = false;
                isHoldToSpeak = false;
                holdButton.classList.remove('holding');
                holdButton.textContent = 'Hold to Speak';
                transcriptContainer.classList.remove('listening');
                statusDot.classList.remove('active');
                statusText.textContent = 'Ready';
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                const now = Date.now();

                // Check for pause and add separator if needed
                if (pauseTimer) {
                    clearTimeout(pauseTimer);
                }

                // If more than PAUSE_THRESHOLD has passed since last speech, add separator
                if (now - lastSpeechTime > PAUSE_THRESHOLD && finalTranscript.trim().length > 0) {
                    // Check if the last element isn't already a separator
                    if (!finalTranscript.endsWith('<hr class="speech-separator">')) {
                        finalTranscript += '<hr class="speech-separator">';
                    }
                }

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;

                    if (event.results[i].isFinal) {
                        // Check for voice commands in the transcript
                        const wasCommandDetected = detectVoiceCommand(finalTranscript + transcript + ' ');

                        // Only add to transcript if no command was detected
                        if (!wasCommandDetected) {
                            finalTranscript += transcript + ' ';
                            lastSpeechTime = now;
                        }
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // Update display
                const displayHTML = finalTranscript +
                    (interimTranscript ? `<span class="interim-text">${interimTranscript}</span>` : '');

                transcriptText.innerHTML = displayHTML || '<div class="placeholder">Listening...</div>';
                editButton.disabled = !finalTranscript;

                // Auto-scroll to bottom
                transcriptContainer.scrollTop = transcriptContainer.scrollHeight;

                // Update last speech time for any speech activity
                lastSpeechTime = now;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);

                let errorMsg = '';
                switch (event.error) {
                    case 'no-speech':
                        errorMsg = 'No speech detected. Please try speaking again.';
                        break;
                    case 'audio-capture':
                        errorMsg = 'No microphone found. Please check your microphone connection.';
                        break;
                    case 'not-allowed':
                        errorMsg = 'Microphone access denied. Please allow microphone access in your browser settings.';
                        break;
                    case 'network':
                        errorMsg = 'Network error occurred. Please check your internet connection.';
                        break;
                    default:
                        errorMsg = `Error occurred: ${event.error}. Please try again.`;
                }

                errorMessage.textContent = errorMsg;
                errorMessage.style.display = 'block';

                // Auto-hide error after 5 seconds for non-critical errors
                if (event.error === 'no-speech') {
                    setTimeout(() => {
                        errorMessage.style.display = 'none';
                    }, 5000);
                }
            };

        }
    </script>
</body>
</html>
