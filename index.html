<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nanna - Speech to Text</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Nanna - Speech to Text">
    <meta name="description" content="Real-time speech to text for deaf and hearing-impaired users">

    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nanna">

    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icon.png">

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Theme Colors -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            /* Light mode colors */
            --bg-primary: #f5f5f5;
            --bg-secondary: white;
            --btn-subtle-bg: #e2e2e2;
            --btn-subtle-hover-bg: #d6ebff;
            --btn-subtle-color: #000000;
            --text-primary: #212121;
            --text-secondary: #757575;
            --text-placeholder: #bdbdbd;
            --border-color: #ddd;
            --shadow: rgba(0, 0, 0, 0.1);
            --shadow-hover: rgba(0, 0, 0, 0.15);
            --separator-color: #ddd;
            --scrollbar-track: #f1f1f1;
            --scrollbar-thumb: #888;
            --scrollbar-thumb-hover: #555;
            --attn: #f44336;
            --hold-button-bg: #3b41f2;
            --hold-button-color: white;
        }

        body.dark-mode {
            /* Dark mode colors */
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --btn-subtle-bg: #424242;
            --btn-subtle-hover-bg: #616161;
            --btn-subtle-color: #ffffff;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-placeholder: #666;
            --border-color: #444;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.5);
            --separator-color: #444;
            --scrollbar-track: #1a1a1a;
            --scrollbar-thumb: #555;
            --scrollbar-thumb-hover: #777;
            --attn: #fe6e64;
            --hold-button-bg: #6368ff;
            --hold-button-color: white;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: var(--bg-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease;
            /* Support for iPhone notch and safe areas */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* Browser mode: fixed header + explicit top offset so transcript never overlaps */
        body.in-browser .header {
            position: fixed;
            top: env(safe-area-inset-top, 0);
            left: 0;
            right: 0;
            z-index: 100;
            flex-shrink: 0;
        }
        body.in-browser .transcript-container {
            flex: 1 1 auto;
            min-height: 0;
            margin-top: calc(64px + env(safe-area-inset-top, 0));
        }
        @media (max-width: 768px) {
            body.in-browser .transcript-container {
                margin-top: calc(74px + env(safe-area-inset-top, 0));
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            height: 64px;
            min-height: 64px;
            box-sizing: border-box;
            background: var(--bg-secondary);
            box-shadow: 0 2px 8px var(--shadow);
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
            flex-shrink: 0;
        }

        .header.edit-mode {
            background: #1976D2;
            color: white;
        }

        .header.edit-mode .header-content {
            display: none;
        }

        .header .edit-toolbar-content {
            display: none;
        }

        .header.edit-mode .edit-toolbar-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .header-left {
            display: flex;
            gap: 15px;
        }

        .header-right {
            display: flex;
            gap: 15px;
        }
        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 0 0 0 rgba(244, 67, 54, 0.7);
            }
            50% {
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 0 0 15px rgba(244, 67, 54, 0);
            }
        }

        .clear-button, .edit-button, .copy-button, .fullscreen-button {
            background: var(--btn-subtle-bg);
            color: var(--btn-subtle-color);
            border: none; 
            font-size: 18px;
            font-weight: 400;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
            width: 60px;
            flex-shrink: 0;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .clear-button:hover, .edit-button:hover, .copy-button:hover, .fullscreen-button:hover {
            background: var(--btn-subtle-hover-bg);
            transform: translateY(-2px);
            box-shadow: none;
        }

        .font-controls {
            display: flex;
            gap: 1px;
            align-items: center;
        }

        .font-button {
            background: var(--btn-subtle-bg);
            color: var(--btn-subtle-color);
            border: none;
            padding: 12px 0;
            font-size: 20px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 50px;
            width: 44px;
            height: 44px;
        }

        #decreaseFontButton {
            border-radius: 8px 0 0 8px;
        }

        #increaseFontButton {
            border-radius: 0 8px 8px 0;
        }

        .font-button:hover {
            background: #d6ebff;
            transform: translateY(-2px);
        }

        .font-button:active {
            transform: translateY(0);
        }

        .font-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .font-size-label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
            white-space: nowrap;
        } 

        .copy-button.copied {
            background: #4CAF50 !important;
        }

        #copyButtonText {
            display: none;
        }

        .speech-separator {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--separator-color), transparent);
            margin: 20px 0;
            opacity: 0.6;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 500;
            color: #666;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            transition: background 0.3s ease;
        }

        .status-dot.active {
            background: var(--attn);
        }
        #statusText {
            display: none;
        }
        .transcript-container {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: var(--bg-secondary);
            margin: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            border: 4px solid transparent;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .transcript-container.edit-mode {
            cursor: text;
            user-select: text;
            -webkit-user-select: text;
        }

        .transcript-container.listening {
            border: 4px solid var(--attn);
            box-shadow: 0 4px 12px var(--shadow-hover);
        }

        .transcript-text {
            font-size: 48px;
            line-height: 1.6;
            color: var(--text-primary);
            word-wrap: break-word;
            white-space: pre-wrap;
            transition: color 0.3s ease;
        }

        .interim-text {
            color: var(--attn); 
        }

        .error-message {
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            border: 2px solid #ffc107;
            font-size: 18px;
            text-align: center;
        }

        .placeholder {
            color: var(--text-placeholder);
            font-size: 32px;
            text-align: center;
            padding: 60px 20px;
            font-style: italic;
            transition: color 0.3s ease;
        }

        @media (max-width: 768px) {
            .transcript-text {
                font-size: 36px;
            }

            .header {
                padding: 15px;
                height: 74px;
                min-height: 74px;
            }

            .transcript-container {
                padding: 20px;
                margin: 15px;
            }

            .placeholder {
                font-size: 24px;
                padding: 40px 15px;
            }
        }

        @media (max-width: 480px) {
            .transcript-text {
                font-size: 28px;
            }

            .placeholder {
                font-size: 20px;
            }

            .header {
                gap: 10px;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .transcript-text {
                font-weight: 600;
            }

            .transcript-container {
                border: 3px solid #000;
            }
        }

        /* Scrollbar styling */
        .transcript-container::-webkit-scrollbar {
            width: 12px;
        }

        .transcript-container::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 6px;
        }

        .transcript-container::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 6px;
        }

        .transcript-container::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* Voice command indicator */
        .command-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(76, 175, 80, 0.95);
            color: white;
            padding: 30px 50px;
            border-radius: 12px;
            font-size: 32px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .command-indicator.show {
            opacity: 1;
        }

        .command-indicator.error {
            background: rgba(244, 67, 54, 0.95);
        }

        /* Theme toggle button */
        .theme-toggle {
            background: #424242;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            width: 44px;
            height: 44px;
        }

        .theme-toggle:hover {
            background: #616161;
            transform: translateY(-2px);
            box-shadow: none;
        }

        .theme-toggle:active {
            transform: translateY(0);
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
        }

        .hold-button {
            display: inline-block;
            background: var(--hold-button-bg);
            color: var(--hold-button-color);
            border: none;
            padding: 15px 15px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .hold-button.holding {
            background: var(--attn);
            animation: pulse 1.5s infinite;
        }
        .hold-icon-off {
            display: block;
        }
        .hold-icon-listening {
            display: none;
        }
        .hold-button.holding .hold-icon-off {
            display: none;
        }
        .hold-button.holding .hold-icon-listening {
            display: block;
        }

        @media (max-width: 768px) {
            .header-left {
                width: 100%;
                flex-wrap: nowwrap;
            }
            .hide-on-mobile {
                display: none;
            }
            .hold-button {
                width: 100%;
            }
        }  
        .svg-icon {
            width: 24px;
            height: 24px;
        }

        .edit-toolbar-label {
            font-size: 17px;
            font-weight: 600;
            opacity: 0.9;
        }

        .edit-done-button {
            background: white;
            color: #1976D2;
            border: none;
            padding: 10px 28px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            min-height: 44px;
            min-width: 80px;
        }

        .edit-done-button:active {
            opacity: 0.85;
        }

        /* Make transcript editable */
        .transcript-text[contenteditable="true"] {
            outline: none;
            caret-color: #1976D2;
        }
        .edit-button:disabled, .copy-button:disabled, .fullscreen-button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        /* Quick-access punctuation overlay */
        .quick-actions {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            right: 24px;
            z-index: 50;
            display: none;
            flex-direction: row;
            gap: 8px;
        }

        .quick-actions.visible {
            display: flex;
        }

        .quick-action-btn {
            background: var(--btn-subtle-bg);
            color: var(--btn-subtle-color);
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 12px;
            font-size: 26px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .quick-action-btn:hover {
            background: var(--btn-subtle-hover-bg);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-hover);
        }

        .quick-action-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px var(--shadow);
        }

        /* Fullscreen overlay */
        .fullscreen-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: var(--bg-secondary);
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        .fullscreen-overlay.visible {
            display: flex;
        }

        .fullscreen-close {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top, 0px));
            right: calc(20px + env(safe-area-inset-right, 0px));
            z-index: 2001;
            background: var(--btn-subtle-bg);
            color: var(--btn-subtle-color);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--shadow);
            transition: background 0.2s ease, transform 0.2s ease;
            opacity: 0.7;
        }

        .fullscreen-close:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .fullscreen-close:active {
            transform: scale(0.95);
        }

        .fullscreen-text {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            padding-top: 100px;
            line-height: 1.6;
            color: var(--text-primary);
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .fullscreen-text {
                padding: 24px;
                padding-top: 90px;
            }

            .fullscreen-close {
                top: calc(15px + env(safe-area-inset-top, 0px));
                right: calc(15px + env(safe-area-inset-right, 0px));
            }
        }

        @media (max-width: 480px) {
            .fullscreen-text {
                padding: 20px;
                padding-top: 92px;
            }
        }
    </style>
</head>
<body class="in-browser">
    <script>
        (function() {
            var isStandalone = false;
            try {
                isStandalone = window.matchMedia('(display-mode: standalone)').matches;
            } catch (e) {}
            if (!isStandalone && window.navigator.standalone === true) {
                isStandalone = true;
            }
            if (isStandalone) {
                document.body.classList.remove('in-browser');
                document.body.classList.add('standalone');
            }
        })();

        document.addEventListener('beforeinput', function(e) {
            if (e.inputType === 'historyUndo' || e.inputType === 'historyRedo') {
                e.preventDefault();
            }
        });
    </script>

                    <span class="font-size-label sr-only">Text Size:</span>
                    <button class="font-button" id="decreaseFontButton" title="Decrease text size">A-</button>
                    <button class="font-button" id="increaseFontButton" title="Increase text size">A+</button>
                </div>
                <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">
                    <span id="themeIcon">🌙</span>
                </button>
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Ready</span>
                </div>
            </div>
        </div>
        <div class="edit-toolbar-content">
            <span class="edit-toolbar-label">Editing</span>
            <button class="edit-done-button" id="editDoneButton">Done</button>
        </div>
    </div>

    <div class="transcript-container" id="transcriptContainer">
        <div class="transcript-text" id="transcriptText">
            <div class="placeholder">Hold to speak</div>
        </div>
    </div>

    <div class="quick-actions" id="quickActions">
        <button class="quick-action-btn" id="questionMarkButton" title="Append question mark">?</button>
    </div>

    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <button class="fullscreen-close" id="fullscreenClose" title="Exit full screen"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="svg-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9 3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5 5.25 5.25" /></svg></button>
        <div class="fullscreen-text" id="fullscreenText"></div>
    </div>

    <div class="error-message" id="errorMessage" style="display: none;"></div>

    <div class="command-indicator" id="commandIndicator"></div>

    <script>
        // Check for browser support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            document.getElementById('errorMessage').textContent =
                'Sorry, your browser does not support speech recognition. Please use Chrome, Edge, or Safari.';
            document.getElementById('errorMessage').style.display = 'block';
            const holdBtn = document.getElementById('holdButton');
            holdBtn.disabled = true;
            holdBtn.style.opacity = '0.5';
            holdBtn.style.cursor = 'not-allowed';
        } else {
            // Initialize speech recognition
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            // Request mic permission on every load so the prompt appears immediately
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => stream.getTracks().forEach(t => t.stop()))
                .catch(() => {});

            let isListening = false;
            let isHoldToSpeak = false;
            let finalTranscript = '';
            let lastProcessedIndex = 0; // guards against Android bug where resultIndex is always 0

            const holdButton = document.getElementById('holdButton');
            const clearButton = document.getElementById('clearButton');
            const transcriptText = document.getElementById('transcriptText');
            const transcriptContainer = document.getElementById('transcriptContainer');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const errorMessage = document.getElementById('errorMessage');
            const increaseFontButton = document.getElementById('increaseFontButton');
            const decreaseFontButton = document.getElementById('decreaseFontButton');
            const copyButton = document.getElementById('copyButton');
            const copyButtonText = document.getElementById('copyButtonText');
            const commandIndicator = document.getElementById('commandIndicator');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const editButton = document.getElementById('editButton');
            const editDoneButton = document.getElementById('editDoneButton');
            const header = document.getElementById('header');
            const fullscreenButton = document.getElementById('fullscreenButton');
            const questionMarkButton = document.getElementById('questionMarkButton');
            const quickActions = document.getElementById('quickActions');
            const fullscreenOverlay = document.getElementById('fullscreenOverlay');
            const fullscreenClose = document.getElementById('fullscreenClose');
            const fullscreenText = document.getElementById('fullscreenText');

            // Theme management
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeIcon.textContent = '☀️';
            }

            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                themeIcon.textContent = isDark ? '☀️' : '🌙';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });

            // Voice commands configuration
            const voiceCommands = {
                'clear text': () => {
                    finalTranscript = '';
                    transcriptText.innerHTML = isListening ?
                        '<div class="placeholder">Listening...</div>' :
                        '<div class="placeholder">Hold to speak</div>';
                    showCommandFeedback('✓ Text Cleared');
                }
            };

            // Function to show command feedback
            function showCommandFeedback(message, isError = false) {
                commandIndicator.textContent = message;
                commandIndicator.classList.remove('error');
                if (isError) {
                    commandIndicator.classList.add('error');
                }
                commandIndicator.classList.add('show');

                setTimeout(() => {
                    commandIndicator.classList.remove('show');
                }, 1500);
            }

            // Function to detect and execute voice commands
            function detectVoiceCommand(text) {
                const lowerText = text.toLowerCase().trim();

                for (const [command, action] of Object.entries(voiceCommands)) {
                    if (lowerText.includes(command)) {
                        // Execute the command
                        action();
                        return true;
                    }
                }
                return false;
            }

            // Pause detection
            let lastSpeechTime = Date.now();
            let pauseTimer = null;
            const PAUSE_THRESHOLD = 1000; // 1 second

            // Font size management
            const MIN_FONT_SIZE = 20;
            const MAX_FONT_SIZE = 100;
            const FONT_STEP = 4;
            let currentFontSize = parseInt(localStorage.getItem('transcriptFontSize')) || 48;

            function updateFontSize(size) {
                currentFontSize = Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, size));
                transcriptText.style.fontSize = currentFontSize + 'px';
                localStorage.setItem('transcriptFontSize', currentFontSize);

                // Update placeholder size to be proportional
                const placeholder = transcriptText.querySelector('.placeholder');
                if (placeholder) {
                    placeholder.style.fontSize = Math.max(20, currentFontSize * 0.67) + 'px';
                }

                // Update button states
                decreaseFontButton.disabled = currentFontSize <= MIN_FONT_SIZE;
                increaseFontButton.disabled = currentFontSize >= MAX_FONT_SIZE;
            }

            // Initialize font size on load
            updateFontSize(currentFontSize);

            // Font size button handlers
            increaseFontButton.addEventListener('click', () => {
                updateFontSize(currentFontSize + FONT_STEP);
            });

            decreaseFontButton.addEventListener('click', () => {
                updateFontSize(currentFontSize - FONT_STEP);
            });

            // Copy button click handler
            copyButton.addEventListener('click', async () => {
                try {
                    // Get only the text content, excluding HTML tags
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = finalTranscript;

                    // Remove HR elements and get text
                    const hrs = tempDiv.querySelectorAll('hr');
                    hrs.forEach(hr => hr.replaceWith('\n\n'));

                    let textToCopy = tempDiv.textContent.trim();

                    if (!textToCopy) {
                        return; // Nothing to copy
                    }

                    await navigator.clipboard.writeText(textToCopy);

                    // Show feedback
                    copyButton.classList.add('copied');
                    copyButtonText.textContent = 'Copied!';

                    setTimeout(() => {
                        copyButton.classList.remove('copied');
                        copyButtonText.textContent = 'Copy';
                    }, 2000);
                } catch (error) {
                    console.error('Failed to copy:', error);
                    copyButtonText.textContent = 'Failed';
                    setTimeout(() => {
                        copyButtonText.textContent = 'Copy';
                    }, 2000);
                }
            });

            // Hold-to-speak button handlers
            function startHoldToSpeak() {
                if (isListening || isEditing) return;
                isHoldToSpeak = true;
                holdButton.classList.add('holding');
                try {
                    recognition.start();
                } catch (error) {
                    console.error('Hold to speak start error:', error);
                    isHoldToSpeak = false;
                    holdButton.classList.remove('holding');
                }
            }

            function stopHoldToSpeak() {
                if (!isHoldToSpeak) return;
                isHoldToSpeak = false;
                holdButton.classList.remove('holding');
                recognition.stop();
            }

            holdButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startHoldToSpeak();
            }, { passive: false });

            holdButton.addEventListener('touchend', (e) => {
                e.preventDefault();
                stopHoldToSpeak();
            }, { passive: false });

            holdButton.addEventListener('touchcancel', () => {
                stopHoldToSpeak();
            });

            // Mouse fallback for desktop testing
            holdButton.addEventListener('mousedown', startHoldToSpeak);
            holdButton.addEventListener('mouseup', stopHoldToSpeak);
            holdButton.addEventListener('mouseleave', stopHoldToSpeak);

            // Prevent context menu on long press
            holdButton.addEventListener('contextmenu', (e) => e.preventDefault());

            // Transcript area: press anywhere to record (same as hold button)
            transcriptContainer.addEventListener('touchstart', (e) => {
                if (!isEditing) {
                    e.preventDefault();
                    startHoldToSpeak();
                }
            }, { passive: false });

            transcriptContainer.addEventListener('touchend', (e) => {
                if (!isEditing) {
                    e.preventDefault();
                    stopHoldToSpeak();
                }
            }, { passive: false });

            transcriptContainer.addEventListener('touchcancel', () => {
                if (!isEditing) stopHoldToSpeak();
            });

            transcriptContainer.addEventListener('mousedown', (e) => {
                if (!isEditing) startHoldToSpeak();
            });
            transcriptContainer.addEventListener('mouseup', (e) => {
                if (!isEditing) stopHoldToSpeak();
            });
            transcriptContainer.addEventListener('mouseleave', (e) => {
                if (!isEditing) stopHoldToSpeak();
            });

            transcriptContainer.addEventListener('contextmenu', (e) => {
                if (!isEditing) e.preventDefault();
            });

            // Clear button click handler
            clearButton.addEventListener('click', () => {
                finalTranscript = '';
                if (isListening) {
                    transcriptText.innerHTML = '<div class="placeholder">Listening...</div>';
                } else {
                    transcriptText.innerHTML = '<div class="placeholder">Hold to speak</div>';
                }
                editButton.disabled = true;
                copyButton.disabled = true;
                fullscreenButton.disabled = true;
                quickActions.classList.remove('visible');
                errorMessage.style.display = 'none';
                lastSpeechTime = Date.now(); // Reset pause timer
                updateFontSize(currentFontSize); // Update placeholder font size
            });

            // Question mark button
            questionMarkButton.addEventListener('click', () => {
                if (!finalTranscript) return;
                finalTranscript = finalTranscript
                    .replace(/(<hr class="speech-separator">|\s)*$/, '') + '?';
                transcriptText.innerHTML = finalTranscript;
                transcriptContainer.scrollTop = transcriptContainer.scrollHeight;
                quickActions.classList.remove('visible');
            });

            // Edit mode
            let isEditing = false;
            let wasListeningBeforeEdit = false;

            function enterEditMode() {
                if (isEditing || !finalTranscript) return;
                isEditing = true;
                wasListeningBeforeEdit = isListening;
                if (isListening) recognition.stop();

                transcriptText.contentEditable = 'true';
                header.classList.add('edit-mode');
                transcriptContainer.classList.add('edit-mode');
                quickActions.classList.remove('visible');

                // Place cursor at end
                transcriptText.focus();
                const range = document.createRange();
                range.selectNodeContents(transcriptText);
                range.collapse(false);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }

            function exitEditMode() {
                if (!isEditing) return;
                isEditing = false;

                transcriptText.contentEditable = 'false';
                transcriptText.blur();
                header.classList.remove('edit-mode');
                transcriptContainer.classList.remove('edit-mode');

                // Sync edits back to finalTranscript
                finalTranscript = transcriptText.innerHTML;
                if (transcriptText.querySelector('.placeholder')) {
                    finalTranscript = '';
                }
                editButton.disabled = !finalTranscript;
                copyButton.disabled = !finalTranscript;
                fullscreenButton.disabled = !finalTranscript;
                quickActions.classList.toggle('visible', !!finalTranscript);
            }

            editButton.addEventListener('click', enterEditMode);
            editDoneButton.addEventListener('click', exitEditMode);

            // Fullscreen mode - use large text for readability (min 96px desktop, 72px mobile, or user's preference if larger)
            fullscreenButton.addEventListener('click', () => {
                fullscreenText.innerHTML = finalTranscript;
                const minSize = window.innerWidth < 768 ? 60 : 96;
                const fullscreenFontSize = Math.max(currentFontSize, minSize);
                fullscreenText.style.fontSize = fullscreenFontSize + 'px';
                fullscreenOverlay.classList.add('visible');
            });

            fullscreenClose.addEventListener('click', () => {
                fullscreenOverlay.classList.remove('visible');
            });

            // Recognition event handlers
            recognition.onstart = () => {
                isListening = true;
                transcriptContainer.classList.add('listening');
                statusDot.classList.add('active');
                statusText.textContent = 'Listening...';
                errorMessage.style.display = 'none';
                lastSpeechTime = Date.now(); // Reset pause timer
                lastProcessedIndex = 0; // Reset for new recognition session

                // Clear placeholder if present
                if (transcriptText.querySelector('.placeholder')) {
                    transcriptText.innerHTML = '';
                }
                updateFontSize(currentFontSize); // Ensure font size is applied
            };

            recognition.onend = () => {
                isListening = false;
                isHoldToSpeak = false;
                holdButton.classList.remove('holding');
                transcriptContainer.classList.remove('listening');
                statusDot.classList.remove('active');
                statusText.textContent = 'Ready';
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                const now = Date.now();

                // Check for pause and add separator if needed
                if (pauseTimer) {
                    clearTimeout(pauseTimer);
                }

                // If more than PAUSE_THRESHOLD has passed since last speech, add separator
                if (now - lastSpeechTime > PAUSE_THRESHOLD && finalTranscript.trim().length > 0) {
                    // Check if the last element isn't already a separator
                    if (!finalTranscript.endsWith('<hr class="speech-separator">')) {
                        finalTranscript += '<hr class="speech-separator">';
                    }
                }

                // On Android Chrome, event.resultIndex is often stuck at 0, causing all
                // previously-processed final results to be re-delivered on every event.
                // We track lastProcessedIndex ourselves to skip results we've already appended.
                const startIndex = Math.max(event.resultIndex, lastProcessedIndex);

                for (let i = startIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;

                    if (event.results[i].isFinal) {
                        // Check for voice commands in the transcript
                        const wasCommandDetected = detectVoiceCommand(finalTranscript + transcript + ' ');

                        // Only add to transcript if no command was detected
                        if (!wasCommandDetected) {
                            finalTranscript += transcript + ' ';
                            lastSpeechTime = now;
                        }
                        lastProcessedIndex = i + 1;
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // Update display
                const displayHTML = finalTranscript +
                    (interimTranscript ? `<span class="interim-text">${interimTranscript}</span>` : '');

                transcriptText.innerHTML = displayHTML || '<div class="placeholder">Listening...</div>';
                editButton.disabled = !finalTranscript;
                copyButton.disabled = !finalTranscript;
                fullscreenButton.disabled = !finalTranscript;
                quickActions.classList.toggle('visible', !!finalTranscript);

                // Auto-scroll to bottom
                transcriptContainer.scrollTop = transcriptContainer.scrollHeight;

                // Update last speech time for any speech activity
                lastSpeechTime = now;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);

                let errorMsg = '';
                switch (event.error) {
                    case 'aborted':
                        return;
                    case 'no-speech':
                        errorMsg = 'No speech detected. Please try speaking again.';
                        break;
                    case 'audio-capture':
                        return;
                    case 'not-allowed':
                        errorMsg = 'Microphone access denied. Please allow microphone access in your browser settings.';
                        break;
                    case 'network':
                        errorMsg = 'Network error occurred. Please check your internet connection.';
                        break;
                    default:
                        errorMsg = `Error occurred: ${event.error}. Please try again.`;
                }

                errorMessage.textContent = errorMsg;
                errorMessage.style.display = 'block';

                // Auto-hide error after 5 seconds for non-critical errors
                if (event.error === 'no-speech') {
                    setTimeout(() => {
                        errorMessage.style.display = 'none';
                    }, 5000);
                }
            };

        }
    </script>
</body>
</html>
