<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Nanna - Speech to Text</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Nanna - Speech to Text">
    <meta name="description" content="Real-time speech to text for deaf and hearing-impaired users">

    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nanna">

    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icon.png">

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Theme Colors -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            /* Light mode colors */
            --bg-primary: #f5f5f5;
            --bg-secondary: white;
            --btn-subtle-bg: #e2e2e2;
            --btn-subtle-hover-bg: #d6ebff;
            --btn-subtle-color: #000000;
            --text-primary: #212121;
            --text-secondary: #757575;
            --text-placeholder: #bdbdbd;
            --border-color: #ddd;
            --shadow: rgba(0, 0, 0, 0.1);
            --shadow-hover: rgba(0, 0, 0, 0.15);
            --separator-color: #ddd;
            --scrollbar-track: #f1f1f1;
            --scrollbar-thumb: #888;
            --scrollbar-thumb-hover: #555;
            --attn: #f44336;
            --hold-button-bg: #3b41f2;
            --hold-button-color: white;
        }

        body.dark-mode {
            /* Dark mode colors */
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --btn-subtle-bg: #424242;
            --btn-subtle-hover-bg: #616161;
            --btn-subtle-color: #ffffff;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-placeholder: #666;
            --border-color: #444;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.5);
            --separator-color: #444;
            --scrollbar-track: #1a1a1a;
            --scrollbar-thumb: #555;
            --scrollbar-thumb-hover: #777;
            --attn: #fe6e64;
            --hold-button-bg: #6368ff;
            --hold-button-color: white;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* iOS 18 standalone-PWA keyboard mitigation: keep native touch/selection
           behavior on anything editable so the soft keyboard can appear. */
        input, textarea, [contenteditable="true"] {
            touch-action: auto;
            -webkit-user-select: text;
            user-select: text;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: var(--bg-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease;
            /* Support for iPhone notch and safe areas */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* Browser mode: fixed header + explicit top offset so transcript never overlaps */
        body.in-browser .header {
            position: fixed;
            top: env(safe-area-inset-top, 0);
            left: 0;
            right: 0;
            z-index: 100;
            flex-shrink: 0;
        }
        body.in-browser .transcript-container {
            flex: 1 1 auto;
            min-height: 0;
            margin-top: calc(64px + env(safe-area-inset-top, 0));
        }
        @media (max-width: 768px) {
            body.in-browser .transcript-container {
                margin-top: calc(74px + env(safe-area-inset-top, 0));
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            height: 64px;
            min-height: 64px;
            box-sizing: border-box;
            background: var(--bg-secondary);
            box-shadow: 0 2px 8px var(--shadow);
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
            flex-shrink: 0;
        }

        .header.edit-mode {
            background: #1976D2;
            color: white;
        }

        .header.edit-mode .header-content {
            display: none;
        }

        .header .edit-toolbar-content {
            display: none;
        }

        .header.edit-mode .edit-toolbar-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .header-left {
            display: flex;
            gap: 8px;
        }

        .header-right {
            display: flex;
            gap: 15px;
        }
        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 0 0 0 rgba(244, 67, 54, 0.7);
            }
            50% {
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 0 0 15px rgba(244, 67, 54, 0);
            }
        }

        .clear-button, .edit-button, .copy-button, .fullscreen-button {
            background: var(--btn-subtle-bg);
            color: var(--btn-subtle-color);
            border: none;
            font-size: 18px;
            font-weight: 400;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
            width: 60px;
            flex-shrink: 0;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .clear-button:hover, .edit-button:hover, .copy-button:hover, .fullscreen-button:hover {
            background: var(--btn-subtle-hover-bg);
            transform: translateY(-2px);
            box-shadow: none;
        }

        .font-controls {
            display: flex;
            gap: 1px;
            align-items: center;
        }

        .font-button {
            background: var(--btn-subtle-bg);
            color: var(--btn-subtle-color);
            border: none;
            padding: 12px 0;
            font-size: 20px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 50px;
            width: 44px;
            height: 44px;
        }

        #decreaseFontButton {
            border-radius: 8px 0 0 8px;
        }

        #increaseFontButton {
            border-radius: 0 8px 8px 0;
        }

        .font-button:hover {
            background: #d6ebff;
            transform: translateY(-2px);
        }

        .font-button:active {
            transform: translateY(0);
        }

        .font-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .font-size-label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
            white-space: nowrap;
        } 

        .copy-button.copied {
            background: #4CAF50 !important;
        }

        #copyButtonText {
            display: none;
        }

        .speech-separator {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--separator-color), transparent);
            margin: 20px 0;
            opacity: 0.6;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 500;
            color: #666;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            transition: background 0.3s ease;
        }

        .status-dot.active {
            background: var(--attn);
        }
        #statusText {
            display: none;
        }
        .transcript-container {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: var(--bg-secondary);
            margin: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            border: 4px solid transparent;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .transcript-container.edit-mode {
            cursor: text;
            user-select: text;
            -webkit-user-select: text;
        }

        .transcript-container.listening {
            border: 4px solid var(--attn);
            box-shadow: 0 4px 12px var(--shadow-hover);
        }

        .transcript-text {
            font-size: 48px;
            line-height: 1.6;
            color: var(--text-primary);
            word-wrap: break-word;
            white-space: pre-wrap;
            transition: color 0.3s ease;
        }

        .interim-text {
            color: var(--attn); 
        }

        .error-message {
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            border: 2px solid #ffc107;
            font-size: 18px;
            text-align: center;
        }

        .placeholder {
            color: var(--text-placeholder);
            font-size: 32px;
            text-align: center;
            padding: 60px 20px;
            font-style: italic;
            transition: color 0.3s ease;
        }

        @media (max-width: 768px) {
            .transcript-text {
                font-size: 36px;
            }

            .header {
                padding: 15px;
                height: 74px;
                min-height: 74px;
            }

            .transcript-container {
                padding: 20px;
                margin: 15px;
            }

            .placeholder {
                font-size: 24px;
                padding: 40px 15px;
            }
        }

        @media (max-width: 480px) {
            .transcript-text {
                font-size: 28px;
            }

            .placeholder {
                font-size: 20px;
            }

            .header {
                gap: 10px;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .transcript-text {
                font-weight: 600;
            }

            .transcript-container {
                border: 3px solid #000;
            }
        }

        /* Scrollbar styling */
        .transcript-container::-webkit-scrollbar {
            width: 12px;
        }

        .transcript-container::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 6px;
        }

        .transcript-container::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 6px;
        }

        .transcript-container::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* Voice command indicator */
        .command-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(76, 175, 80, 0.95);
            color: white;
            padding: 30px 50px;
            border-radius: 12px;
            font-size: 32px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .command-indicator.show {
            opacity: 1;
        }

        .command-indicator.error {
            background: rgba(244, 67, 54, 0.95);
        }

        /* Theme toggle button */
        .theme-toggle {
            background: #424242;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            width: 44px;
            height: 44px;
        }

        .theme-toggle:hover {
            background: #616161;
            transform: translateY(-2px);
            box-shadow: none;
        }

        .theme-toggle:active {
            transform: translateY(0);
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
        }

        .hold-button {
            display: inline-block;
            background: var(--hold-button-bg);
            color: var(--hold-button-color);
            border: none;
            padding: 15px 15px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .hold-button.holding {
            background: var(--attn);
            animation: pulse 1.5s infinite;
        }
        .hold-icon-off {
            display: block;
        }
        .hold-icon-listening {
            display: none;
        }
        .hold-button.holding .hold-icon-off {
            display: none;
        }
        .hold-button.holding .hold-icon-listening {
            display: block;
        }

        @media (max-width: 768px) {
            .header-left {
                width: 100%;
                flex-wrap: nowwrap;
            }
            .hide-on-mobile {
                display: none;
            }
            .hold-button {
                width: 100%;
            }
        }  
        .svg-icon {
            width: 24px;
            height: 24px;
        }

        .edit-toolbar-label {
            font-size: 17px;
            font-weight: 600;
            opacity: 0.9;
        }

        .edit-done-button {
            background: white;
            color: #1976D2;
            border: none;
            padding: 10px 28px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            min-height: 44px;
            min-width: 80px;
        }

        .edit-done-button:active {
            opacity: 0.85;
        }

        /* Make transcript editable */
        .transcript-text[contenteditable="true"] {
            outline: none;
            caret-color: #1976D2;
        }
        .edit-button:disabled, .copy-button:disabled, .fullscreen-button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        /* Active (engaged) state for the correct toggle */
        .correct-button.active {
            background: var(--hold-button-bg);
            color: var(--hold-button-color);
        }
        .correct-button.active:hover {
            background: var(--hold-button-bg);
        }

        /* ============================================================
           WORD-CORRECTION FEATURE
           ============================================================ */

        /* Tappable words (only shown while correction mode is active) */
        .transcript-container.correct-mode .transcript-text .word {
            cursor: pointer;
            border-radius: 4px;
            text-decoration: underline;
            text-decoration-style: dotted;
            text-decoration-color: var(--text-secondary);
            text-underline-offset: 6px;
            transition: background-color 0.15s ease;
        }
        .transcript-container.correct-mode .transcript-text .word:hover,
        .transcript-container.correct-mode .transcript-text .word.selected {
            background: var(--btn-subtle-hover-bg);
        }
        .transcript-container.correct-mode {
            box-shadow: inset 0 0 0 3px var(--hold-button-bg);
        }

        /* Suggestion popover */
        .correct-popover {
            display: none;
            position: fixed;
            z-index: 2500;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 30px var(--shadow-hover);
            min-width: 200px;
            max-width: 320px;
            overflow: hidden;
        }
        .correct-popover.visible {
            display: block;
        }
        .correct-popover-header {
            padding: 10px 16px;
            font-size: 14px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .correct-popover-header b {
            color: var(--text-primary);
        }
        .correct-popover-list {
            max-height: 50vh;
            overflow-y: auto;
        }
        .correct-suggestion {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            background: none;
            border: none;
            text-align: left;
            padding: 14px 16px;
            font-size: 20px;
            color: var(--text-primary);
            cursor: pointer;
            font-family: inherit;
        }
        .correct-suggestion:hover {
            background: var(--btn-subtle-hover-bg);
        }
        .correct-suggestion .tag {
            font-size: 12px;
            font-weight: 600;
            color: var(--hold-button-bg);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .correct-suggestion.keep {
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            font-size: 16px;
        }
        .correct-suggestion.empty {
            color: var(--text-secondary);
            font-size: 16px;
            cursor: default;
            font-style: italic;
        }
        .correct-popover-footer {
            display: flex;
            border-top: 1px solid var(--border-color);
        }
        .correct-popover-action {
            flex: 1;
            background: none;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-family: inherit;
            color: var(--hold-button-bg);
            cursor: pointer;
        }
        .correct-popover-action + .correct-popover-action {
            border-left: 1px solid var(--border-color);
        }
        .correct-popover-action:hover {
            background: var(--btn-subtle-hover-bg);
        }

        /* My words manager modal */
        .my-words-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .my-words-overlay.visible {
            display: flex;
        }
        .my-words-modal {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 40px var(--shadow-hover);
        }
        .my-words-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            font-size: 20px;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
        }
        .my-words-close {
            background: none;
            border: none;
            font-size: 22px;
            color: var(--text-secondary);
            cursor: pointer;
            line-height: 1;
            padding: 4px 8px;
        }
        .my-words-modal-body {
            padding: 16px 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .my-words-section + .my-words-section {
            margin-top: 24px;
        }
        .my-words-section h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .my-words-hint {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .my-words-add {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .my-words-add input {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            font-size: 16px;
            font-family: inherit;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            touch-action: auto;
            cursor: text;
        }
        .my-words-arrow {
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .my-words-add-btn {
            flex-shrink: 0;
            background: var(--hold-button-bg);
            color: var(--hold-button-color);
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
        }
        .my-words-list {
            list-style: none;
        }
        .my-words-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 16px;
        }
        .my-words-list .remove-word {
            background: none;
            border: none;
            color: var(--attn);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
        }
        .my-words-empty {
            color: var(--text-secondary);
            font-style: italic;
            font-size: 14px;
            padding: 8px 0;
        }

        /* Quick-access punctuation overlay */
        .quick-actions {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            right: 24px;
            z-index: 50;
            display: none;
            flex-direction: row;
            gap: 8px;
        }

        .quick-actions.visible {
            display: flex;
        }

        .quick-action-btn {
            background: var(--btn-subtle-bg);
            color: var(--btn-subtle-color);
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 12px;
            font-size: 26px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .quick-action-btn:hover {
            background: var(--btn-subtle-hover-bg);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-hover);
        }

        .quick-action-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px var(--shadow);
        }

        .quick-action-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        /* Fullscreen overlay */
        .fullscreen-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: var(--bg-secondary);
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        .fullscreen-overlay.visible {
            display: flex;
        }

        .fullscreen-close {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top, 0px));
            right: calc(20px + env(safe-area-inset-right, 0px));
            z-index: 2001;
            background: var(--btn-subtle-bg);
            color: var(--btn-subtle-color);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--shadow);
            transition: background 0.2s ease, transform 0.2s ease;
            opacity: 0.7;
        }

        .fullscreen-close:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .fullscreen-close:active {
            transform: scale(0.95);
        }

        .fullscreen-text {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            padding-top: 100px;
            line-height: 1.6;
            color: var(--text-primary);
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .fullscreen-text {
                padding: 24px;
                padding-top: 90px;
            }

            .fullscreen-close {
                top: calc(15px + env(safe-area-inset-top, 0px));
                right: calc(15px + env(safe-area-inset-right, 0px));
            }
        }

        @media (max-width: 480px) {
            .fullscreen-text {
                padding: 20px;
                padding-top: 92px;
            }
        }

        /* ============================================================
           LANDSCAPE WORD-SWIPE OVERLAY
           ============================================================ */

        .landscape-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: var(--bg-secondary);
            flex-direction: column;
            align-items: stretch;
            justify-content: stretch;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            transition: background-color 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .landscape-overlay.visible { display: flex; }

        .landscape-word-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 8px 16px;
        }

        .landscape-word {
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            font-weight: 700;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
        }

        .landscape-interim {
            color: var(--attn);
            font-size: 20px;
            font-weight: 500;
            margin-top: 12px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            min-height: 1.4em;
        }

        .landscape-counter {
            position: absolute;
            bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 500;
            pointer-events: none;
            white-space: nowrap;
        }

        .landscape-placeholder {
            color: var(--text-placeholder);
            font-style: italic;
            text-align: center;
        }
    </style>
