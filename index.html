<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nanna - Speech to Text</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Nanna - Speech to Text">
    <meta name="description" content="Real-time speech to text for deaf and hearing-impaired users">

    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nanna">

    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icon.png">

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Theme Colors -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            /* Light mode colors */
            --bg-primary: #f5f5f5;
            --bg-secondary: white;
            --btn-subtle-bg: #e2e2e2;
            --btn-subtle-color: #000000;
            --text-primary: #212121;
            --text-secondary: #757575;
            --text-placeholder: #bdbdbd;
            --border-color: #ddd;
            --shadow: rgba(0, 0, 0, 0.1);
            --shadow-hover: rgba(0, 0, 0, 0.15);
            --separator-color: #ddd;
            --scrollbar-track: #f1f1f1;
            --scrollbar-thumb: #888;
            --scrollbar-thumb-hover: #555;
        }

        body.dark-mode {
            /* Dark mode colors */
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --btn-subtle-bg: #424242;
            --btn-subtle-color: #ffffff;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-placeholder: #666;
            --border-color: #444;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.5);
            --separator-color: #444;
            --scrollbar-track: #1a1a1a;
            --scrollbar-thumb: #555;
            --scrollbar-thumb-hover: #777;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: var(--bg-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease;
            /* Support for iPhone notch and safe areas */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: var(--bg-secondary);
            box-shadow: 0 2px 8px var(--shadow);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .header-left {
            display: flex;
            gap: 15px;
        }

        .header-right {
            display: flex;
            gap: 15px;
        }
        .mic-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .mic-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .mic-button:active {
            transform: translateY(0);
        }

        .mic-button.listening {
            background: #f44336;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 0 0 0 rgba(244, 67, 54, 0.7);
            }
            50% {
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 0 0 15px rgba(244, 67, 54, 0);
            }
        }

        .clear-button {
            background: rgba(226, 226, 226, 1);
            color: rgba(0, 0, 0, 1);
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 400;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
        }

        .clear-button:hover {
            background: #616161;
            transform: translateY(-2px);
            box-shadow: none;
        }

        .font-controls {
            display: flex;
            gap: 1px;
            align-items: center;
        }

        .font-button {
            background: var(--btn-subtle-bg);
            color: var(--btn-subtle-color);
            border: none;
            padding: 12px 0;
            font-size: 20px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 50px;
            width: 44px;
            height: 44px;
        }

        #decreaseFontButton {
            border-radius: 8px 0 0 8px;
        }

        #increaseFontButton {
            border-radius: 0 8px 8px 0;
        }

        .font-button:hover {
            background: #d6ebff;
            transform: translateY(-2px);
        }

        .font-button:active {
            transform: translateY(0);
        }

        .font-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .font-size-label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
            white-space: nowrap;
        }

        .copy-button { 
            background: rgba(237, 237, 237, 1);
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .copy-button:hover {
            background: #F57C00;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .copy-button.copied {
            background: #4CAF50;
        }

        #copyButtonText {
            display: none;
        }

        .speech-separator {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--separator-color), transparent);
            margin: 20px 0;
            opacity: 0.6;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 500;
            color: #666;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            transition: background 0.3s ease;
        }

        .status-dot.active {
            background: #f44336;
        }
        #statusText {
            display: none;
        }
        .transcript-container {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: var(--bg-secondary);
            margin: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .transcript-container.listening {
            border: 4px solid #f44336;
        }

        .transcript-text {
            font-size: 48px;
            line-height: 1.6;
            color: var(--text-primary);
            word-wrap: break-word;
            white-space: pre-wrap;
            transition: color 0.3s ease;
        }

        .interim-text {
            color: var(--text-secondary);
            font-style: italic;
        }

        .error-message {
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            border: 2px solid #ffc107;
            font-size: 18px;
            text-align: center;
        }

        .placeholder {
            color: var(--text-placeholder);
            font-size: 32px;
            text-align: center;
            padding: 60px 20px;
            font-style: italic;
            transition: color 0.3s ease;
        }

        @media (max-width: 768px) {
            .transcript-text {
                font-size: 36px;
            }

            .header {
                padding: 15px;
            }

            .mic-button, .clear-button {
                padding: 12px 30px;
                font-size: 16px;
            }

            .transcript-container {
                padding: 20px;
                margin: 15px;
            }

            .placeholder {
                font-size: 24px;
                padding: 40px 15px;
            }
        }

        @media (max-width: 480px) {
            .transcript-text {
                font-size: 28px;
            }

            .placeholder {
                font-size: 20px;
            }

            .header {
                gap: 10px;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .transcript-text {
                font-weight: 600;
            }

            .transcript-container {
                border: 3px solid #000;
            }
        }

        /* Scrollbar styling */
        .transcript-container::-webkit-scrollbar {
            width: 12px;
        }

        .transcript-container::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 6px;
        }

        .transcript-container::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 6px;
        }

        .transcript-container::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* Voice command indicator */
        .command-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(76, 175, 80, 0.95);
            color: white;
            padding: 30px 50px;
            border-radius: 12px;
            font-size: 32px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .command-indicator.show {
            opacity: 1;
        }

        .command-indicator.error {
            background: rgba(244, 67, 54, 0.95);
        }

        /* Theme toggle button */
        .theme-toggle {
            background: #424242;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            width: 44px;
            height: 44px;
        }

        .theme-toggle:hover {
            background: #616161;
            transform: translateY(-2px);
            box-shadow: none;
        }

        .theme-toggle:active {
            transform: translateY(0);
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
        }

        /* Slow mode toggle */
        .slow-mode-toggle {
            background: var(--btn-subtle-bg);
            color: var(--btn-subtle-color);
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
            white-space: nowrap;
        }

        .slow-mode-toggle.active {
            background: #4CAF50;
            color: white;
        }

        .slow-mode-toggle:hover {
            transform: translateY(-2px);
        }

        .slow-mode-toggle:active {
            transform: translateY(0);
        }

        /* Slow mode display */
        .slow-mode-display {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
        }

        .slow-mode-display.active {
            display: flex;
        }

        .slow-mode-word {
            font-size: 120px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            line-height: 1.2;
            margin-bottom: 40px;
            transition: color 0.3s ease;
            word-break: break-word;
        }

        .slow-mode-context {
            font-size: 48px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.4;
            opacity: 0.6;
            transition: color 0.3s ease, opacity 0.3s ease;
        }

        /* Hide normal transcript in slow mode */
        body.slow-mode-active .transcript-text:not(.slow-mode-display) {
            display: none;
        }

        body.slow-mode-active .slow-mode-display {
            display: flex;
        }

        @media (max-width: 768px) {
            .slow-mode-word {
                font-size: 80px;
            }

            .slow-mode-context {
                font-size: 32px;
            }
        }

        @media (max-width: 480px) {
            .slow-mode-word {
                font-size: 60px;
            }

            .slow-mode-context {
                font-size: 24px;
            }
        } 
        .hold-button {
            display: none;
            background: #2196F3;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .hold-button.holding {
            background: #f44336;
            animation: pulse 1.5s infinite;
        }

        @media (max-width: 768px) {
            .header-left {
                width: 100%;
                flex-wrap: wrap;
            }
            .hide-on-mobile {
                display: none;
            }
            .mic-button {
                flex: 1;
            }
            .hold-button {
                display: block;
                width: 100%;
            }
        }  
        .svg-icon {
            width: 24px;
            height: 24px;
        } 
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <button class="mic-button" id="micButton">Start Listening</button>
            <button class="clear-button" id="clearButton"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="svg-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg></button>
            <button class="slow-mode-toggle hide-on-mobile" id="slowModeToggle" title="Toggle slow mode (one word at a time)">Slow Mode</button>
            <button class="hold-button" id="holdButton">Hold to Speak</button>
        </div>
        <div class="header-right hide-on-mobile">
            <button class="copy-button" id="copyButton" title="Copy text to clipboard">
                <span>📋</span>
                <span id="copyButtonText">Copy</span>
            </button>
            <div class="font-controls">
                <span class="font-size-label sr-only">Text Size:</span>
                <button class="font-button" id="decreaseFontButton" title="Decrease text size">A-</button>
                <button class="font-button" id="increaseFontButton" title="Increase text size">A+</button>
            </div>
            <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">
                <span id="themeIcon">🌙</span>
            </button>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Ready</span>
            </div>
        </div>
    </div>

    <div class="transcript-container" id="transcriptContainer">
        <div class="transcript-text" id="transcriptText">
            <div class="placeholder">Click "Start Listening" to begin</div>
        </div>
        <div class="slow-mode-display" id="slowModeDisplay">
            <div class="slow-mode-word" id="slowModeWord"></div>
            <div class="slow-mode-context" id="slowModeContext"></div>
        </div>
    </div>

    <div class="error-message" id="errorMessage" style="display: none;"></div>

    <div class="command-indicator" id="commandIndicator"></div>

    <script>
        // Check for browser support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            document.getElementById('errorMessage').textContent =
                'Sorry, your browser does not support speech recognition. Please use Chrome, Edge, or Safari.';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('micButton').disabled = true;
            document.getElementById('micButton').style.opacity = '0.5';
            document.getElementById('micButton').style.cursor = 'not-allowed';
        } else {
            // Initialize speech recognition
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            let isListening = false;
            let isPaused = false;
            let isHoldToSpeak = false;
            let finalTranscript = '';

            const micButton = document.getElementById('micButton');
            const holdButton = document.getElementById('holdButton');
            const clearButton = document.getElementById('clearButton');
            const transcriptText = document.getElementById('transcriptText');
            const transcriptContainer = document.getElementById('transcriptContainer');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const errorMessage = document.getElementById('errorMessage');
            const increaseFontButton = document.getElementById('increaseFontButton');
            const decreaseFontButton = document.getElementById('decreaseFontButton');
            const copyButton = document.getElementById('copyButton');
            const copyButtonText = document.getElementById('copyButtonText');
            const commandIndicator = document.getElementById('commandIndicator');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const slowModeToggle = document.getElementById('slowModeToggle');
            const slowModeDisplay = document.getElementById('slowModeDisplay');
            const slowModeWord = document.getElementById('slowModeWord');
            const slowModeContext = document.getElementById('slowModeContext');

            // Slow mode state
            let isSlowMode = localStorage.getItem('slowMode') === 'true';
            let slowModeWords = [];
            const SLOW_MODE_CONTEXT_WORDS = 3; // Show last 3 words for context

            // Apply saved slow mode state
            if (isSlowMode) {
                document.body.classList.add('slow-mode-active');
                slowModeToggle.classList.add('active');
            }

            // Slow mode toggle handler
            slowModeToggle.addEventListener('click', () => {
                isSlowMode = !isSlowMode;
                document.body.classList.toggle('slow-mode-active', isSlowMode);
                slowModeToggle.classList.toggle('active', isSlowMode);
                localStorage.setItem('slowMode', isSlowMode);

                // Clear slow mode display when toggling off
                if (!isSlowMode) {
                    slowModeWord.textContent = '';
                    slowModeContext.textContent = '';
                    slowModeWords = [];
                }
            });

            // Theme management
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeIcon.textContent = '☀️';
            }

            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                themeIcon.textContent = isDark ? '☀️' : '🌙';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });

            // Voice commands configuration
            const voiceCommands = {
                'clear text': () => {
                    finalTranscript = '';
                    slowModeWords = [];
                    slowModeWord.textContent = '';
                    slowModeContext.textContent = '';
                    transcriptText.innerHTML = isPaused ?
                        '<div class="placeholder">Paused - Say "start listening" to resume</div>' :
                        '<div class="placeholder">Listening...</div>';
                    showCommandFeedback('✓ Text Cleared');
                },
                'stop listening': () => {
                    if (isListening && !isPaused) {
                        isPaused = true;
                        updatePausedState();
                        showCommandFeedback('✓ Paused');
                    }
                },
                'start listening': () => {
                    if (isPaused) {
                        isPaused = false;
                        updatePausedState();
                        showCommandFeedback('✓ Resumed');
                    }
                },
                'slow mode off': () => {
                    if (isSlowMode) {
                        isSlowMode = false;
                        document.body.classList.remove('slow-mode-active');
                        slowModeToggle.classList.remove('active');
                        localStorage.setItem('slowMode', 'false');
                        slowModeWord.textContent = '';
                        slowModeContext.textContent = '';
                        slowModeWords = [];
                        showCommandFeedback('✓ Slow Mode Off');
                    }
                },
                'slow mode': () => {
                    if (!isSlowMode) {
                        isSlowMode = true;
                        document.body.classList.add('slow-mode-active');
                        slowModeToggle.classList.add('active');
                        localStorage.setItem('slowMode', 'true');
                        showCommandFeedback('✓ Slow Mode On');
                    }
                }
            };

            // Function to update slow mode display
            function updateSlowModeDisplay(newWords) {
                if (!isSlowMode) return;

                // Add new words to the array
                const words = newWords.split(/\s+/).filter(w => w.length > 0);
                slowModeWords.push(...words);

                // Get the current word (last word)
                const currentWord = slowModeWords[slowModeWords.length - 1];

                // Get context words (previous words)
                const contextWords = slowModeWords.slice(
                    Math.max(0, slowModeWords.length - SLOW_MODE_CONTEXT_WORDS - 1),
                    slowModeWords.length - 1
                );

                // Update display
                slowModeWord.textContent = currentWord || '';
                slowModeContext.textContent = contextWords.join(' ');
            }

            // Function to update UI based on paused state
            function updatePausedState() {
                if (isPaused) {
                    statusText.textContent = 'Paused';
                    statusDot.classList.remove('active');
                    transcriptContainer.classList.remove('listening');
                    if (finalTranscript.trim().length === 0) {
                        transcriptText.innerHTML = '<div class="placeholder">Paused - Say "start listening" to resume</div>';
                    }
                } else {
                    statusText.textContent = 'Listening...';
                    statusDot.classList.add('active');
                    transcriptContainer.classList.add('listening');
                    if (finalTranscript.trim().length === 0) {
                        transcriptText.innerHTML = '<div class="placeholder">Listening...</div>';
                    }
                }
            }

            // Function to show command feedback
            function showCommandFeedback(message, isError = false) {
                commandIndicator.textContent = message;
                commandIndicator.classList.remove('error');
                if (isError) {
                    commandIndicator.classList.add('error');
                }
                commandIndicator.classList.add('show');

                setTimeout(() => {
                    commandIndicator.classList.remove('show');
                }, 1500);
            }

            // Function to detect and execute voice commands
            function detectVoiceCommand(text) {
                const lowerText = text.toLowerCase().trim();

                for (const [command, action] of Object.entries(voiceCommands)) {
                    if (lowerText.includes(command)) {
                        // Execute the command
                        action();
                        return true;
                    }
                }
                return false;
            }

            // Pause detection
            let lastSpeechTime = Date.now();
            let pauseTimer = null;
            const PAUSE_THRESHOLD = 1000; // 1 second

            // Font size management
            const MIN_FONT_SIZE = 20;
            const MAX_FONT_SIZE = 100;
            const FONT_STEP = 4;
            let currentFontSize = parseInt(localStorage.getItem('transcriptFontSize')) || 48;

            function updateFontSize(size) {
                currentFontSize = Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, size));
                transcriptText.style.fontSize = currentFontSize + 'px';
                localStorage.setItem('transcriptFontSize', currentFontSize);

                // Update placeholder size to be proportional
                const placeholder = transcriptText.querySelector('.placeholder');
                if (placeholder) {
                    placeholder.style.fontSize = Math.max(20, currentFontSize * 0.67) + 'px';
                }

                // Update button states
                decreaseFontButton.disabled = currentFontSize <= MIN_FONT_SIZE;
                increaseFontButton.disabled = currentFontSize >= MAX_FONT_SIZE;
            }

            // Initialize font size on load
            updateFontSize(currentFontSize);

            // Font size button handlers
            increaseFontButton.addEventListener('click', () => {
                updateFontSize(currentFontSize + FONT_STEP);
            });

            decreaseFontButton.addEventListener('click', () => {
                updateFontSize(currentFontSize - FONT_STEP);
            });

            // Copy button click handler
            copyButton.addEventListener('click', async () => {
                try {
                    // Get only the text content, excluding HTML tags
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = finalTranscript;

                    // Remove HR elements and get text
                    const hrs = tempDiv.querySelectorAll('hr');
                    hrs.forEach(hr => hr.replaceWith('\n\n'));

                    let textToCopy = tempDiv.textContent.trim();

                    if (!textToCopy) {
                        return; // Nothing to copy
                    }

                    await navigator.clipboard.writeText(textToCopy);

                    // Show feedback
                    copyButton.classList.add('copied');
                    copyButtonText.textContent = 'Copied!';

                    setTimeout(() => {
                        copyButton.classList.remove('copied');
                        copyButtonText.textContent = 'Copy';
                    }, 2000);
                } catch (error) {
                    console.error('Failed to copy:', error);
                    copyButtonText.textContent = 'Failed';
                    setTimeout(() => {
                        copyButtonText.textContent = 'Copy';
                    }, 2000);
                }
            });

            // Start/Stop button click handler
            micButton.addEventListener('click', () => {
                if (isListening) {
                    recognition.stop();
                    isPaused = false; // Reset paused state when manually stopping
                } else {
                    try {
                        recognition.start();
                        isPaused = false; // Ensure not paused when starting
                    } catch (error) {
                        console.error('Recognition start error:', error);
                    }
                }
            });

            // Hold-to-speak button handlers
            function startHoldToSpeak() {
                if (isListening) return;
                isHoldToSpeak = true;
                holdButton.classList.add('holding');
                holdButton.textContent = 'Listening...';
                try {
                    recognition.start();
                    isPaused = false;
                } catch (error) {
                    console.error('Hold to speak start error:', error);
                    isHoldToSpeak = false;
                    holdButton.classList.remove('holding');
                    holdButton.textContent = 'Hold to Speak';
                }
            }

            function stopHoldToSpeak() {
                if (!isHoldToSpeak) return;
                isHoldToSpeak = false;
                holdButton.classList.remove('holding');
                holdButton.textContent = 'Hold to Speak';
                recognition.stop();
            }

            holdButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startHoldToSpeak();
            }, { passive: false });

            holdButton.addEventListener('touchend', (e) => {
                e.preventDefault();
                stopHoldToSpeak();
            }, { passive: false });

            holdButton.addEventListener('touchcancel', () => {
                stopHoldToSpeak();
            });

            // Mouse fallback for desktop testing
            holdButton.addEventListener('mousedown', startHoldToSpeak);
            holdButton.addEventListener('mouseup', stopHoldToSpeak);
            holdButton.addEventListener('mouseleave', stopHoldToSpeak);

            // Prevent context menu on long press
            holdButton.addEventListener('contextmenu', (e) => e.preventDefault());

            // Clear button click handler
            clearButton.addEventListener('click', () => {
                finalTranscript = '';
                slowModeWords = [];
                slowModeWord.textContent = '';
                slowModeContext.textContent = '';
                if (isPaused) {
                    transcriptText.innerHTML = '<div class="placeholder">Paused - Say "start listening" to resume</div>';
                } else if (isListening) {
                    transcriptText.innerHTML = '<div class="placeholder">Listening...</div>';
                } else {
                    transcriptText.innerHTML = '<div class="placeholder">Click "Start Listening" to begin</div>';
                }
                errorMessage.style.display = 'none';
                lastSpeechTime = Date.now(); // Reset pause timer
                updateFontSize(currentFontSize); // Update placeholder font size
            });

            // Recognition event handlers
            recognition.onstart = () => {
                isListening = true;
                if (!isHoldToSpeak) {
                    micButton.textContent = 'Stop Listening';
                    micButton.classList.add('listening');
                }
                transcriptContainer.classList.add('listening');
                statusDot.classList.add('active');
                statusText.textContent = 'Listening...';
                errorMessage.style.display = 'none';
                lastSpeechTime = Date.now(); // Reset pause timer

                // Clear placeholder if present
                if (transcriptText.querySelector('.placeholder')) {
                    transcriptText.innerHTML = '';
                }
                updateFontSize(currentFontSize); // Ensure font size is applied
            };

            recognition.onend = () => {
                isListening = false;
                if (!isHoldToSpeak) {
                    micButton.textContent = 'Start Listening';
                    micButton.classList.remove('listening');
                }
                isHoldToSpeak = false;
                holdButton.classList.remove('holding');
                holdButton.textContent = 'Hold to Speak';
                transcriptContainer.classList.remove('listening');
                statusDot.classList.remove('active');
                statusText.textContent = 'Ready';
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                const now = Date.now();

                // Check for pause and add separator if needed
                if (pauseTimer) {
                    clearTimeout(pauseTimer);
                }

                // If more than PAUSE_THRESHOLD has passed since last speech, add separator
                if (now - lastSpeechTime > PAUSE_THRESHOLD && finalTranscript.trim().length > 0) {
                    // Check if the last element isn't already a separator
                    if (!finalTranscript.endsWith('<hr class="speech-separator">')) {
                        finalTranscript += '<hr class="speech-separator">';
                    }
                }

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;

                    if (event.results[i].isFinal) {
                        // Check for voice commands in the new transcript
                        const wasCommandDetected = detectVoiceCommand(isPaused ? transcript : (finalTranscript + transcript + ' '));

                        // Only add to transcript if not paused AND no command was detected
                        if (!isPaused && !wasCommandDetected) {
                            finalTranscript += transcript + ' ';
                            lastSpeechTime = now;

                            // Update slow mode display with new words
                            if (isSlowMode) {
                                updateSlowModeDisplay(transcript);
                            }
                        }
                    } else {
                        // Only show interim results if not paused
                        if (!isPaused) {
                            interimTranscript += transcript;

                            // In slow mode, show interim results as the current word
                            if (isSlowMode && transcript.trim()) {
                                const interimWords = transcript.split(/\s+/).filter(w => w.length > 0);
                                if (interimWords.length > 0) {
                                    slowModeWord.textContent = interimWords[interimWords.length - 1];
                                }
                            }
                        }
                    }
                }

                // Update display only if not paused
                if (!isPaused) {
                    const displayHTML = finalTranscript +
                        (interimTranscript ? `<span class="interim-text">${interimTranscript}</span>` : '');

                    transcriptText.innerHTML = displayHTML || '<div class="placeholder">Listening...</div>';
                }

                // Auto-scroll to bottom
                transcriptContainer.scrollTop = transcriptContainer.scrollHeight;

                // Update last speech time for any speech activity
                lastSpeechTime = now;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);

                let errorMsg = '';
                switch (event.error) {
                    case 'no-speech':
                        errorMsg = 'No speech detected. Please try speaking again.';
                        break;
                    case 'audio-capture':
                        errorMsg = 'No microphone found. Please check your microphone connection.';
                        break;
                    case 'not-allowed':
                        errorMsg = 'Microphone access denied. Please allow microphone access in your browser settings.';
                        break;
                    case 'network':
                        errorMsg = 'Network error occurred. Please check your internet connection.';
                        break;
                    default:
                        errorMsg = `Error occurred: ${event.error}. Please try again.`;
                }

                errorMessage.textContent = errorMsg;
                errorMessage.style.display = 'block';

                // Auto-hide error after 5 seconds for non-critical errors
                if (event.error === 'no-speech') {
                    setTimeout(() => {
                        errorMessage.style.display = 'none';
                    }, 5000);
                }
            };

            // Restart recognition if it stops unexpectedly (browser limitation workaround)
            recognition.onend = () => {
                isListening = false;
                micButton.textContent = 'Start Listening';
                micButton.classList.remove('listening');
                transcriptContainer.classList.remove('listening');
                statusDot.classList.remove('active');
                statusText.textContent = 'Ready';
            };
        }
    </script>
</body>
</html>
